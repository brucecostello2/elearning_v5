# ivgs-backup-worker test configuration
#
# WP-52. This suite could not run from the repo root at all. Two module-name
# collisions, both structural:
#
#   * `tasks`. This service and `ivgs-workers` BOTH ship a top-level `tasks`
#     package. The root `pyproject.toml` lists `ivgs-workers` on `pythonpath`
#     and does not list `ivgs-backup-worker` at all, so
#     `from tasks.backup_tasks import ...` imported the WORKERS' package, which
#     pulls in `celery_app` -> `config` and died on a missing VLLM_PRIMARY_URL.
#     A `PYTHONPATH=` prefix does not help: pytest inserts its own `pythonpath`
#     entries ahead of the inherited environment.
#   * The same shape as WP-32.1's `tests` collision, and as the scheduler's
#     `main` collision (ledger P2.51) -- flat per-service top-level names that
#     are unambiguous inside each container and ambiguous in one pytest process.
#
# Giving this service its own inifile gives it its own import namespace, which
# is the honest fix available without renaming packages across three services.
# The root run is unaffected: `pyproject.toml`'s `testpaths` never included
# `ivgs-backup-worker`, so nothing else resolves through this file.
#
# Run it as:
#     .venv/bin/python -m pytest ivgs-backup-worker/tests
# or, from the repo root with the root pyproject in the way (CI does this):
#     python -m pytest -c ivgs-backup-worker/pytest.ini ivgs-backup-worker/tests
#
# WP-74: `pythonpath` used to be the absolute `/opt/ivgs/ivgs-backup-worker
# /opt/ivgs`, which resolves on node-01 and nowhere else -- on a GitHub runner
# the checkout is under /home/runner/work, the entries were dead, and `tasks`
# resolved to the WORKERS' package again. pytest resolves `pythonpath` entries
# relative to this file's directory, so `.` and `..` are the same two paths on
# every host.
#
# It needs a reachable disposable Postgres; `tests/conftest.py` takes it from
# BACKUP_TEST_DSN (default 127.0.0.1, which node-01 does not publish).
# See dev/workpackages/reference/TEST-BASELINE_2026-08-25.md.
[pytest]
addopts = -v --tb=short --import-mode=importlib
pythonpath = . ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
