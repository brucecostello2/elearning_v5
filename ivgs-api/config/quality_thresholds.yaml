# IVGS v5 — Quality Thresholds (§11.1 Table 11-1)
# Quality scoring approve/flag/reject thresholds

quality_thresholds:
  image:
    clip_score:
      description: "CLIP similarity between prompt and generated image"
      approve_threshold: 0.25
      flag_threshold: 0.18
      reject_threshold: 0.10
      weight: 0.4

    resolution_check:
      description: "Image matches target resolution"
      approve_threshold: 1.0
      flag_threshold: 0.9
      reject_threshold: 0.0
      weight: 0.2

    artifact_detection:
      description: "No visual artifacts detected"
      approve_threshold: 0.95
      flag_threshold: 0.80
      reject_threshold: 0.50
      weight: 0.2

    content_safety:
      description: "Self-hosted classifier score"
      approve_threshold: 0.98
      flag_threshold: 0.90
      reject_threshold: 0.50
      weight: 0.2

  audio:
    snr:
      description: "Signal-to-Noise Ratio in dB"
      approve_threshold: 20.0
      flag_threshold: 15.0
      reject_threshold: 10.0
      unit: "dB"
      weight: 0.4

    clipping:
      description: "Audio clipping percentage"
      approve_threshold: 0.01   # < 1%
      flag_threshold: 0.03      # < 3%
      reject_threshold: 0.05    # < 5%
      weight: 0.3

    duration_accuracy:
      description: "Duration within 10% of expected"
      approve_threshold: 0.90
      flag_threshold: 0.80
      reject_threshold: 0.50
      weight: 0.3

  video:
    resolution_match:
      description: "Output resolution matches target"
      approve_threshold: 1.0
      flag_threshold: 0.9
      reject_threshold: 0.0
      weight: 0.3

    fps_check:
      description: "Framerate matches target (24 fps)"
      approve_threshold: 24.0
      flag_threshold: 20.0
      reject_threshold: 15.0
      weight: 0.2

    codec_check:
      description: "Correct codec (H.264 for 1080p, H.265 for 4K)"
      approve_threshold: 1.0
      reject_threshold: 0.0
      weight: 0.2

    corruption_check:
      description: "FFprobe validation passes"
      approve_threshold: 1.0
      reject_threshold: 0.0
      weight: 0.3

  talking_head:
    # ------------------------------------------------------------------
    # NOTHING HERE MEASURES LIP-SYNC ARTICULATION. See ledger P1.4e.
    #
    # Four metrics existed across IVGS and MBCP; none could detect the
    # defect that made LatentSync non-viable on 2026-06-08 (mouth shapes
    # failing to form words). The only real measurement of articulation
    # ever taken is that human verdict.
    # ------------------------------------------------------------------

    # RENAMED from `lip_sync_score` on 2026-08-15. The old name was wrong:
    # this never measured lip-sync. `lipsync_validator` computes
    #     1 - (abs(video_duration - audio_duration) / audio_duration)
    # and its base_score saturates at 1.0 via min(1.0, (frame+energy)/2 + 0.2),
    # so the result is A/V DURATION AGREEMENT and nothing else. It read
    # 0.9971 on 2026-06-08 and again on 2026-08-15 because the durations did
    # not change - it is unmoved by any articulation change whatsoever.
    #
    # NON-FUNCTIONAL: weight 0.0 so it no longer contributes a false pass.
    # Retained (not deleted) so the number stays visible and its history is
    # legible. Do NOT restore a weight until something real backs it.
    av_duration_agreement:
      description: >-
        A/V duration agreement, NOT lip-sync. Non-functional as a gate.
        See ledger P1.4e.
      status: non_functional
      non_functional_since: "2026-08-15"
      non_functional_reason: >-
        Measures duration only and saturates; cannot fail on articulation,
        which is the defect that matters.
      approve_threshold: 0.85
      flag_threshold: 0.70
      reject_threshold: 0.50
      weight: 0.0

    # The one genuinely working check IVGS has at this stage.
    #
    # Promoted 2026-08-15 from the `duration_penalty` term that was buried
    # inside the score above. This IS a real measurement - it would have
    # caught the 0.6187 s head A/V drift that AD-03 S10 criterion 3 records
    # as open (owned by WP-04-FRAME-ALIGN).
    #
    # Thresholds are drift in SECONDS, so LOWER IS BETTER - the inverse of
    # every other entry in this file. Read the comparison direction before
    # editing.
    #   approve  <= 0.0334 s  = 1 frame at 30 fps, the AD-03 criterion-3 target
    #   flag     <= 1.0    s  = measurable drift, viewable but wrong
    #   reject    > 1.0    s  = gross desync
    # Measured 2026-08-15: 0.6187 s -> FLAGGED. That is correct and expected;
    # WP-04 closes it. Do not relax these to make it pass.
    av_drift_seconds:
      description: "Absolute video-minus-audio duration drift, in seconds"
      comparison: lower_is_better
      approve_threshold: 0.0334
      flag_threshold: 1.0
      reject_threshold: 1.0
      weight: 1.0

# Overall decision rules
decision_rules:
  approved: "All weighted scores above approve_threshold"
  flagged: "Any score between flag_threshold and approve_threshold"
  rejected: "Any score below reject_threshold"
