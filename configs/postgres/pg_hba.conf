# =============================================================================
# IVGS v5 — PostgreSQL client authentication            WP-60 Task 12(b)
# =============================================================================
# THIS FILE IS THE PROVISIONING. It is bind-mounted read-only and selected with
# `-c hba_file=`, so it governs from the first second of every start.
#
# WHY IT EXISTS.
#
# `scripts/basebackup.sh` needs a REPLICATION connection. The shipped
# provisioning had no replication entry for the compose network, so
# `pg_basebackup` from the backup-worker container could not connect at all --
# while the script's `--dry-run` PASSED, because the pre-flight checked the
# ROLE's `rolreplication` attribute and `max_wal_senders`, both of which were
# fine, and never attempted the connection those attributes are for. The dry
# run validated strictly fewer preconditions than the real path exercises: the
# WP-54 pattern.
#
# The operator unblocked it on 2026-08-26 by appending
#
#     host replication ivgs 172.20.0.0/16 scram-sha-256
#
# directly to the pg_hba.conf INSIDE the postgres data volume, and running
# pg_reload_conf(). That works, and it is invisible to this repository and to
# every fresh cluster: `initdb` generates pg_hba.conf, so a data-directory
# rebuild -- a volume recreate, a restore, a move to another host -- silently
# drops the line and the weekly base backup stops with a connection error that
# nothing in the tree explains. An `initdb.d` script would not have covered it
# either: those run only when the data directory is EMPTY, so an existing
# volume would keep the hand-edit and a rebuilt one would get the script, and
# the two would drift.
#
# Pointing postgres at a tracked file removes the whole question. What governs
# is what is committed, on a fresh cluster and an existing one alike.
#
# The rules below are the LIVE effective ruleset captured from the running
# 17.2 cluster on 2026-08-26, in order, with nothing added and nothing removed
# except that the operator's hand-edit is now here rather than in the volume.
# Order is significant: PostgreSQL uses the FIRST matching row.
# =============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# --- Local socket. `trust` is required by the postgres image's own entrypoint,
#     which runs initdb/psql over the socket before any password exists.
local   all             all                                     trust

# --- Loopback inside the container.
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# --- Replication over the socket and loopback.
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# --- THE LINE THIS FILE EXISTS FOR.
#     pg_basebackup runs from ivgs-backup-worker, on the compose bridge network
#     (172.20.0.0/16). Without it the weekly physical base backup cannot
#     connect, and PITR has no base to replay onto -- which fails silently:
#     the WAL archive keeps filling and every dashboard stays green while the
#     ability to recover to an instant is lost. `BaseBackupStale` (8 days) is
#     the tripwire, and this row is what stops it firing.
#
#     It is placed BEFORE the catch-all below because a `replication` request
#     is not matched by a `DATABASE all` row -- PostgreSQL treats replication
#     as its own database keyword -- so ordering is belt-and-braces here, but
#     the ordering rule is real and worth not learning at 3 a.m.
host    replication     ivgs            172.20.0.0/16           scram-sha-256

# --- Everything else: password-authenticated, from anywhere the network
#     allows. Unchanged from the shipped configuration.
host    all             all             all                     scram-sha-256
