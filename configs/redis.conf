# =============================================================
# IVGS v5 — Redis 7 Configuration (node-01)
# Used for: Celery broker, result backend, session cache,
#           GPU scheduler state, token blacklist
# =============================================================

# --- Network ---
bind 0.0.0.0
port 6379
protected-mode yes
requirepass CHANGE_ME_REDIS_PASSWORD
tcp-backlog 511
timeout 300
tcp-keepalive 60

# --- Memory ---
maxmemory 8gb
maxmemory-policy allkeys-lru

# --- Persistence (AOF) ---
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 512mb

# --- RDB snapshots ---
save 900 1
save 300 10
save 60 10000

# --- Logging ---
loglevel notice
logfile ""

# --- Security ---
rename-command FLUSHDB ""
rename-command FLUSHALL ""

# --- Clients ---
maxclients 10000
