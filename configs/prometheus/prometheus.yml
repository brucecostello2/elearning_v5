# Prometheus scrape configuration for IVGS v4 Phase 2
global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: 'production'
    project: 'ivgs'

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: 'ivgs-api'
    static_configs:
      - targets: ['node-01:8000']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'ivgs-scheduler'
    static_configs:
      - targets: ['node-01:8001']
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-01:9100'
          - 'node-02:9100'
          - 'node-03:9100'
          - 'node-04:9100'
          - 'node-05:9100'
          - 'node-06:9100'
    scrape_interval: 15s

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['node-01:9419']
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
