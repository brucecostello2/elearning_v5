# ============================================================
# IVGS v5 — Python Project Configuration
# ============================================================

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.git
  | \.venv
  | node_modules
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["shared", "ivgs_api", "ivgs_workers", "ivgs_scheduler"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "node_modules", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "ivgs_api", "ivgs_workers", "ivgs_scheduler"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/", "node_modules/"]

[[tool.mypy.overrides]]
module = ["tests.*", "ivgs_workers.tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["ivgs-api/tests", "ivgs-workers/tests", "ivgs-scheduler/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: Integration tests (require running services)",
    "slow: Tests that take >10 seconds",
    "gpu: Tests that require GPU access",
]
pythonpath = ["ivgs-api", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]
skips = ["B101"]  # Allow assert in tests
