# =============================================================================
# IVGS v5 — Compliance Audit CI
# =============================================================================
# Spec reference: §15.3 Table 15-2 Row 4 — CI Compliance Audit
#                 Appendix F.2 — Prohibited Dependency Scanner
#                 §18.3 — Prohibited Actions
#
# Trigger: All branches, all repos
# Action: Fail build on any violation
# =============================================================================

name: Compliance Audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  compliance-scan:
    name: "Prohibited Dependency Scan (§F.2)"
    # Moved off self-hosted 2026-08-22 (operator ruling; ledger P1.4k).
    # The self-hosted runner has been dead since 2026-05-26, so every run of this
    # workflow QUEUED rather than failed -- 87 days in which the section F.2 gate
    # gated nothing while the UI showed no red. This job needs nothing from node-01:
    # checkout, setup-python, four greps and scripts/compliance_scanner.py, all
    # against the checked-out repo. No docker, no ssh, no host path, no network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Rule 1: Prohibited environment variables"
        run: |
          echo "Scanning for prohibited env vars..."
          # Match only REAL, UNCOMMENTED assignments: start of line, optional
          # whitespace, the variable name, optional whitespace, then = or :.
          #
          # Fixed 2026-08-22 (ledger P1.4l). The previous pattern was a bare
          # substring match, so it fired on the prohibition comments that
          # document the policy -- "# OPENAI_API_KEY - NEVER" in .env.template
          # and all six .env.node0X.template files. Those comments ARE the
          # policy's documentation and must not have to hide from its
          # enforcement, so the rule was narrowed rather than the templates
          # edited. It also fired on the scanner's own test fixtures in
          # tests/test_compliance_scanner.py, which are quoted string literals
          # and so no longer match either.
          #
          # The [=:] alternation also closes a real gap: this rule scans *.yml
          # and *.yaml, where a leak would read "OPENAI_API_KEY: sk-..." with a
          # colon. The old substring pattern caught that only by accident; an
          # "=" -only anchor would have missed it entirely.
          if grep -rE \
            "^[[:space:]]*(OPENAI_API_KEY|ANTHROPIC_API_KEY|ELEVENLABS_API_KEY|DID_API_KEY|SYNTHESIA_API_KEY)[[:space:]]*[=:]" \
            --include="*.env*" --include="*.yml" --include="*.yaml" --include="*.py" \
            --exclude-dir=".git" \
            --exclude="compliance_scanner.py" \
            --exclude="compliance-check.yml" \
            . ; then
            echo "::error::PROHIBITED environment variables found!"
            exit 1
          fi
          echo "✓ No prohibited env vars found"

      - name: "Rule 2: Prohibited pip packages"
        run: |
          echo "Scanning for prohibited pip packages..."
          if grep -rE \
            "^openai|^anthropic|^elevenlabs|^did-client|^synthesia" \
            requirements*.txt pyproject.toml 2>/dev/null ; then
            echo "::error::PROHIBITED pip packages found!"
            exit 1
          fi
          echo "✓ No prohibited pip packages found"

      - name: "Rule 3: Prohibited API endpoints"
        run: |
          echo "Scanning for prohibited API endpoints..."
          if grep -rE \
            "api\.openai\.com|api\.anthropic\.com|api\.elevenlabs\.io|api\.d-id\.com" \
            --include="*.py" --include="*.ts" --include="*.js" \
            --exclude-dir=".git" \
            --exclude="compliance_scanner.py" \
            --exclude="compliance-check.yml" \
            . ; then
            echo "::error::PROHIBITED API endpoints found!"
            exit 1
          fi
          echo "✓ No prohibited API endpoints found"

      - name: "Rule 4: Prohibited import patterns"
        run: |
          echo "Scanning for prohibited imports..."
          if grep -rE \
            "^import openai|^from openai|^import anthropic|^from anthropic|^import elevenlabs|^from elevenlabs" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude="compliance_scanner.py" \
            --exclude="compliance-check.yml" \
            . ; then
            echo "::error::PROHIBITED imports found!"
            exit 1
          fi
          echo "✓ No prohibited imports found"

      - name: "Run full compliance scanner"
        run: python scripts/compliance_scanner.py .

      - name: "Compliance check summary"
        if: always()
        run: echo "✓ All compliance checks passed — §F.2 satisfied"
