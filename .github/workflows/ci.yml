# IVGS v5 — CI/CD Pipeline
# Runs on every push and PR per §15.5 branch strategy

name: CI/CD

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

# WP-63 Task 10(c). Action majors bumped 2026-08-26 to clear the Node.js 20
# deprecation annotations: checkout v4 -> v7, setup-python v5 -> v7,
# setup-node v4 -> v7. What the changelogs declare, and what it means here:
#
#   checkout v5      node24 runtime; MINIMUM RUNNER v2.327.1.
#   checkout v6      credentials persisted to a separate file.
#   checkout v7      REFUSES to check out a fork PR under `pull_request_target`
#                    or `workflow_run`. Inert here: no workflow in this repo
#                    uses either trigger.
#   setup-python v6  node24 runtime; same v2.327.1 minimum.
#   setup-python v7  the `pip-install` input is REMOVED. Not used here.
#   setup-node   v5  node24; and automatic caching when package.json carries a
#                    `packageManager` field. `ivgs-frontend/package.json` does
#                    not, so nothing starts caching that was not caching before.
#   setup-node   v6  automatic caching narrowed to npm.
#   setup-node   v7  adds cache-primary-key / cache-matched-key outputs.
#
# Every job in THIS file runs on `ubuntu-latest`, so the v2.327.1 runner
# minimum is met by construction.
#
# `.github/workflows/cd-deploy.yml` IS DELIBERATELY NOT BUMPED. Its three jobs
# run on `[self-hosted, linux, x64, ivgs-infra]`, and that runner has been dead
# since 2026-05-26 (see compliance-check.yml's own note). Its agent version
# cannot be read, so whether it meets v2.327.1 is unknown - and a checkout that
# refuses to run is a worse outcome than a deprecation warning on a workflow
# that is only invoked by hand. Bump it when the runner is back and its version
# is known. WP-63 report, Task 10(c).

jobs:
  # ================================================================
  # Job 1: Python Linting & Type Checking
  # ================================================================
  lint-python:
    # WP-74 CI BASELINE: re-enabled. This job had `if: false` since the repo
    # stopped conforming to Black. Measured on 2026-09-05 at 9c406e8
    # (dev/audit/test_baseline_2026-09-05.md §1.1): black would reformat 438
    # of 474 files; ruff reports 4644 findings; mypy stops at one duplicate
    # module name (ivgs-workers/servers/{coqui,cogvideox}/server.py) and checks
    # nothing after it; bandit reports 3 high / 14 medium / 61 low. A wholesale
    # formatting pass is out of scope, so every step below runs and REPORTS,
    # with `continue-on-error` — the annotations and the step summary show the
    # state on every run — and none of them blocks. ⛔ That is an INHERITED lint
    # state, not a green lint job. Flip a step's `continue-on-error` to false
    # when its finding count reaches zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install black ruff mypy "bandit[toml]"
          pip install -r ivgs-api/requirements.txt
          pip install -r ivgs-workers/requirements.txt

      - name: Black format check (inherited — 438 files off Black at 9c406e8)
        continue-on-error: true
        run: |
          black --check --line-length 100 ivgs-api/ ivgs-workers/ ivgs-scheduler/ shared/ 2>&1 | tee black.txt
          echo "### Black (inherited, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          tail -1 black.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff lint (inherited — 4644 findings at 9c406e8)
        continue-on-error: true
        run: |
          ruff check ivgs-api/ ivgs-workers/ ivgs-scheduler/ shared/ --statistics 2>&1 | tee ruff.txt
          echo "### Ruff (inherited, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          tail -12 ruff.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Mypy type check (inherited — blocked by a duplicate module name)
        continue-on-error: true
        run: |
          mypy --ignore-missing-imports ivgs-api/app/ ivgs-workers/ shared/ 2>&1 | tee mypy.txt
          echo "### Mypy (inherited, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          tail -1 mypy.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Bandit security scan (inherited — 3 high / 14 medium / 61 low)
        continue-on-error: true
        run: |
          bandit -r ivgs-api/app/ ivgs-workers/ shared/ -c pyproject.toml 2>&1 | tee bandit.txt
          echo "### Bandit (inherited, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Total issues|Severity" bandit.txt | head -8 >> "$GITHUB_STEP_SUMMARY" || true

  # ================================================================
  # Job 2: Python Unit Tests
  # ================================================================
  test-python:
    # WP-74 CI BASELINE: re-enabled. This job had `if: false` because "the CI
    # environment was never configured to match how our tests expect to run".
    # It is configured now, from dev/audit/test_baseline_2026-09-05.md §1:
    #   * the API suite expects an ALREADY-MIGRATED database whose name ends
    #     `_test` (its conftest TRUNCATEs every table and refuses anything
    #     else), so `alembic upgrade head` runs first against `ivgs_test`;
    #   * both DATABASE_URL and TEST_DATABASE_URL must be set (conftest reads
    #     one, app startup the other);
    #   * the backup-worker suite refuses to import without a sync DSN, a
    #     broker URL and a result backend (RC-J8);
    #   * requirements-dev.txt carries Pillow/numpy/onnxruntime the worker
    #     tests import.
    # Every suite runs through .github/scripts/inherited_failures_plugin.py
    # with .github/ci/inherited_failures.txt: the 48 diagnosed, pre-existing
    # failures in ivgs-workers and ivgs-scheduler are printed in their own
    # section of the log and the step summary, NOT counted as passes, and the
    # step fails on any failure that is not on that list — and on any listed
    # test that starts passing (stale list). The job is green only when every
    # non-inherited test passes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ivgs
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: ivgs_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ivgs:testpassword@localhost:5432/ivgs_test
      TEST_DATABASE_URL: postgresql+asyncpg://ivgs:testpassword@localhost:5432/ivgs_test
      REDIS_URL: redis://localhost:6379/0
      # backup-worker (RC-J8): sync DSN, broker, result backend — all the CI test database
      BACKUP_TEST_DSN: postgresql://ivgs:testpassword@localhost:5432/ivgs_test
      POSTGRES_DSN_SYNC: postgresql://ivgs:testpassword@localhost:5432/ivgs_test
      IVGS_CELERY_BROKER_URL: redis://localhost:6379/1
      IVGS_CELERY_RESULT_BACKEND: db+postgresql://ivgs:testpassword@localhost:5432/ivgs_test
      # the inherited-failures plugin
      PYTHONPATH: .github/scripts
      IVGS_INHERITED_ALLOWLIST: .github/ci/inherited_failures.txt

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r ivgs-api/requirements.txt
          pip install -r ivgs-workers/requirements.txt
          pip install -r ivgs-scheduler/requirements.txt
          pip install -r shared/requirements.txt
          pip install -r requirements-dev.txt

      - name: Migrate the test database to head
        working-directory: ivgs-api
        run: python -m alembic upgrade head

      - name: API tests (ivgs-api) — 1870 passed, 0 inherited at 9c406e8
        run: python -m pytest -p inherited_failures_plugin ivgs-api/tests --tb=short -q

      - name: Worker tests (ivgs-workers) — 33 inherited at 9c406e8, listed in the summary
        run: python -m pytest -p inherited_failures_plugin ivgs-workers/tests --tb=short -q

      - name: Scheduler tests (ivgs-scheduler) — 15 inherited at 9c406e8, listed in the summary
        run: python -m pytest -p inherited_failures_plugin ivgs-scheduler/tests --tb=short -q

      - name: Motion renderer tests (ivgs-motion-renderer) — 0 inherited
        run: python -m pytest -p inherited_failures_plugin ivgs-motion-renderer/tests --tb=short -q

      - name: Backup worker tests (ivgs-backup-worker, own inifile) — 0 inherited
        run: python -m pytest -p inherited_failures_plugin -c ivgs-backup-worker/pytest.ini ivgs-backup-worker/tests --tb=short -q

      - name: System tests, the static subset (tests_system) — 0 inherited
        # WP-54: was `pytest tests/`. That directory has not existed since
        # WP-32.1 renamed it to `tests_system/` to break the module-name
        # collision with `ivgs-api/tests`. `pytest` on a missing path exits 4,
        # so this step had been failing for its own reason rather than running
        # anything -- a gate that reports on a suite it never executed.
        #
        # WP-55: MEASURED what this runner can actually execute, rather than
        # assuming `tests_system/` as a whole. Most of that tree talks to the
        # live fleet -- the API on 8001, the scheduler on 8002, SeaweedFS,
        # Prometheus -- none of which exists on a GitHub runner. Those suites
        # are run on node-01; their 42 diagnosed failures are in
        # dev/audit/test_baseline_2026-09-05.md §2.6 and on the allowlist under
        # a "node-01 only" heading. The four paths below need nothing but the
        # checkout. (WP-56 closed the compliance-scanner failures WP-55 found.)
        run: |
          python -m pytest -p inherited_failures_plugin \
                 tests_system/providers \
                 tests_system/spec_compliance \
                 tests_system/test_compliance_scanner.py \
                 tests_system/test_alert_rules_have_metrics.py \
                 --tb=short -q -rs

      # ================================================================
      # WP-54: alert rules must reference metrics that exist.
      #
      # Runs here for the STATIC half -- exemption-list hygiene, rule-file
      # parse -- which needs nothing but the checkout. The two assertions that
      # compare against the live metric set SKIP here, loudly, because GitHub's
      # runner has no Prometheus; they are the reason this same file is also
      # run on node-01, where it can see one. A gate that quietly passed
      # without Prometheus would be committing the defect it exists to catch,
      # so it says which half it ran.
      # ================================================================
      # Also included in the step above; kept as its own named step so a
      # failure here is legible in the CI summary without reading a combined log.
      - name: Alert rules reference metrics that exist (static half)
        run: python -m pytest tests_system/test_alert_rules_have_metrics.py -v --tb=short -rs

  # ================================================================
  # Job 3: Frontend Lint & Build
  # ================================================================
  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ivgs-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript check
        run: npx tsc --noEmit || true

      # WP-74: the frontend's only test runner is `npm run test:logic` (there is
      # no `npm test` script). 125/125 at the WP-74 head after two test-side
      # fixes (T7, T2 — dev/audit/test_baseline_2026-09-05.md §2.7); blocking.
      - name: Frontend logic tests (npm run test:logic)
        run: npm run test:logic

      - name: Build
        run: npm run build || true

  # ================================================================
  # Job 4: Compliance Scan
  # ================================================================
  compliance-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run compliance scanner
        run: python scripts/compliance_scanner.py .

  # ================================================================
  # Job 5: Docker Build Validation
  # ================================================================
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-python, lint-frontend, compliance-scan]
    strategy:
      matrix:
        service: [ivgs-api, ivgs-workers, ivgs-scheduler, ivgs-frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.service }}:test ${{ matrix.service }}/

  # ================================================================
  # Job 6: Security Scan
  # ================================================================
  security-scan:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build, just report
