# =============================================================================
# IVGS v5 — CD Deployment Pipeline
# =============================================================================
# Spec reference: §15.3 Table 15-2 — CD Pipelines
#                 §15.4 — deploy-node.sh
#                 §15.5 Table 15-3 — main triggers CD
#
# CD — node-01: Push to main → SSH → git pull → compose pull → compose up
# CD — GPU nodes: node-01 runner SSHes sequentially to node-02–06
# =============================================================================

name: CD Deploy (DISABLED)

# =============================================================================
# DISABLED 2026-08-22 by operator ruling. Ledger P1.4k.
#
# WHY. Deployment is done manually, gated, and provably better than this
# workflow would do it. Three independent reasons:
#
#   1. It targets a self-hosted runner that has not existed since 2026-05-26.
#      Runs did not fail -- they QUEUED, indefinitely, while the UI showed
#      nothing red. See WP-DEPLOY-R2-R5-NODE04 section 12.
#   2. It runs scripts/deploy-node.sh, which does `docker compose down` on the
#      WHOLE stack and pulls from GHCR. Both are precisely what the runbook's
#      --no-deps rule and the --pull never correction exist to avoid
#      (WP-DEPLOY-INCIDENT section 4). It would restart Postgres to deploy a worker.
#   3. environment: production, with real secrets, auto-triggered by a path match.
#
# HOW IT IS DISABLED -- belt and braces, either alone would suffice:
#   a. the automatic `push:` trigger is removed; only workflow_dispatch remains
#   b. every job carries `if: false`, matching the convention ci.yml already
#      uses for its two disabled Python jobs
#
# TO RE-ENABLE: restore the `push:` block below and drop the three `if: false`
# lines -- but read the two binding conditions in ledger P1.4k first.
#
# The original trigger, kept verbatim so re-enabling is exact:
#   on:
#     push:
#       branches: [main]
#       paths:
#         - "docker-compose.*.yml"
#         - ".env.*.template"
#         - "scripts/deploy-node.sh"
#         - "configs/**"
# =============================================================================

on:
  workflow_dispatch:

concurrency:
  group: deployment
  cancel-in-progress: false

env:
  DEPLOY_USER: deploy
  INFRA_DIR: /opt/ivgs-infra

jobs:
  # ---------------------------------------------------------------------------
  # CD — node-01 Infrastructure (§15.3 Table 15-2 Row 5)
  # ---------------------------------------------------------------------------
  deploy-node01:
    name: "Deploy node-01 (Infrastructure)"
    runs-on: [self-hosted, linux, x64, ivgs-infra]
    if: false  # DISABLED 2026-08-22 -- ledger P1.4k. See header.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: "Deploy node-01"
        run: |
          cd ${{ env.INFRA_DIR }}
          git pull origin main
          ./scripts/deploy-node.sh node01
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: "Verify node-01 health"
        run: |
          echo "Waiting 30s for services to stabilize..."
          sleep 30
          curl -sf http://localhost:8001/api/v1/health || exit 1
          curl -sf http://localhost:9090/-/healthy || exit 1
          curl -sf http://localhost:3000/api/health || exit 1
          echo "✓ node-01 healthy"

  # ---------------------------------------------------------------------------
  # CD — GPU Nodes Sequential (§15.3 Table 15-2 Row 6)
  # node-01 runner SSHes sequentially to node-02 through node-06
  # ---------------------------------------------------------------------------
  deploy-gpu-nodes:
    name: "Deploy GPU nodes (02–06)"
    needs: deploy-node01
    runs-on: [self-hosted, linux, x64, ivgs-infra]
    if: false  # DISABLED 2026-08-22 -- ledger P1.4k. See header.
    environment: production
    strategy:
      max-parallel: 1
      matrix:
        node: [node02, node03, node04, node05, node06]
    steps:
      - uses: actions/checkout@v4

      - name: "Determine node IP"
        id: node-ip
        run: |
          # Resolve the target IP from node-01's registry (single source), not a hardcoded map
          reg="/opt/ivgs/ivgs-infra/.env"
          node="${{ matrix.node }}"
          key="NODE_${node#node}_IP"
          ip="$(grep -E "^${key}=" "$reg" 2>/dev/null | head -1 | cut -d= -f2)"
          if [ -z "$ip" ]; then echo "::error::${key} not found in ${reg}"; exit 1; fi
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: "Deploy ${{ matrix.node }}"
        run: |
          ssh -o StrictHostKeyChecking=no \
              ${{ env.DEPLOY_USER }}@${{ steps.node-ip.outputs.ip }} \
              "cd ${{ env.INFRA_DIR }} && git pull origin main && ./scripts/deploy-node.sh ${{ matrix.node }}"
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: "Verify ${{ matrix.node }} health"
        run: |
          echo "Waiting 60s for GPU services to initialize..."
          sleep 60
          ssh ${{ env.DEPLOY_USER }}@${{ steps.node-ip.outputs.ip }} \
              "curl -sf http://localhost:9100/metrics > /dev/null && echo '✓ node-exporter healthy'"

  # ---------------------------------------------------------------------------
  # Post-deployment verification
  # ---------------------------------------------------------------------------
  verify-deployment:
    name: "Post-deployment Verification"
    needs: deploy-gpu-nodes
    runs-on: [self-hosted, linux, x64, ivgs-infra]
    if: false  # DISABLED 2026-08-22 -- ledger P1.4k. See header.
    steps:
      - uses: actions/checkout@v4

      - name: "GPU fleet check"
        run: |
          response=$(curl -sf http://localhost:8002/fleet)
          node_count=$(echo "$response" | python3 -c "import sys, json; print(len(json.load(sys.stdin)))")
          echo "GPU nodes registered: $node_count"
          if [ "$node_count" -lt 5 ]; then
            echo "::warning::Expected 5 GPU nodes, found $node_count"
          fi

      - name: "Prometheus targets check"
        run: |
          targets=$(curl -sf http://localhost:9090/api/v1/targets | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          active = [t for t in data['data']['activeTargets'] if t['health'] == 'up']
          print(f'{len(active)} targets UP')
          ")
          echo "$targets"

      - name: "Run compliance scanner"
        run: python scripts/compliance_scanner.py .

      - name: "Deployment complete"
        run: echo "✓ Full deployment verified — all nodes operational"
