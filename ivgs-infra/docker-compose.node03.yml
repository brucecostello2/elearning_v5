# =============================================================================
# IVGS v5 — Docker Compose: node-03 (LLM + Video Diffusion — Primary)
# =============================================================================
# Spec reference: §2.4 Docker Compose Stacks — node-02
#
# Node-02 role (Table 2-2):
#   NVIDIA RTX 6000 Blackwell — 96 GB VRAM
#   vLLM inference (70B+ models, tensor parallel with node-03)
#   CogVideoX / Wan2.1 video generation
#
# Services (6 as deployed):
#   1. vllm               — OpenAI-compatible LLM API (:8000)  [profile: standby]
#   2. cogvideox-worker   — CogVideoX/Wan2.1 + animation Celery worker
#   3. cogvideox-server   — CogVideoX/Wan2.1 model server (:8200)
#   4. wan-animate-server — Wan2.2-Animate ComfyUI engine (:8220)  [WP-46]
#   5. celery-worker      — LLM + video generation queues  [profile: standby]
#   6. node-exporter      — System metrics (:9100)
# =============================================================================


x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-common-logging: &common-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-common-restart: &common-restart
  restart: unless-stopped

x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

networks:
  ivgs-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Service 1: vLLM Primary (Table 2-4: port 8000)
  # Serves Llama 3.3 70B (tensor parallel) and smaller models
  # VRAM: 70 GB for Llama 3.3 70B TP shard (Table B-1)
  # Remaining ~26 GB for CogVideoX scheduling
  # ---------------------------------------------------------------------------
  vllm:
    profiles: ["standby"]
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-cu130-nightly}
    container_name: ivgs-vllm-secondary
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node03
    environment:
      VLLM_HOST: "0.0.0.0"
      VLLM_PORT: "8000"
      HF_HOME: /data/models
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    command: >
      --model ${VLLM_MODEL_NAME:-meta-llama/Llama-3.3-70B-Instruct}
      --tensor-parallel-size ${VLLM_TP_SIZE:-1}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.90}
      --dtype bfloat16
      --trust-remote-code
      --api-key ${VLLM_API_KEY:-ivgs-internal}
      --served-model-name ${VLLM_SERVED_NAME:-llama-70b}
    shm_size: "16g"

  # ---------------------------------------------------------------------------
  # Service 2: CogVideoX / Wan2.1 Worker
  # Video generation Celery worker — processes video_generation queue
  # VRAM: CogVideoX 5B = 24 GB, CogVideoX 2B = 14 GB, Wan2.1 = 16 GB
  # GPU scheduler (§12.2) ensures VRAM availability before dispatch
  # ---------------------------------------------------------------------------
  cogvideox-worker:
    image: ghcr.io/brucecostello2/ivgs-workers:${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-cogvideox-worker-node03
    <<: [*common-restart, *common-logging]
    depends_on: [cogvideox-server]
    env_file:
      - .env.node03
    environment:
      # WP-IVGS-09 Task 0(d). DECLARED AT COMPOSE LEVEL, not inherited from an
      # env file, and not left to the code default.
      #
      # MEASURED 2026-08-28 across all four worker containers:
      #   node-01 ivgs-celery-default          UNSET -> code default 4096
      #   node-02 ivgs-celery-node02           2048  (from .env.node02)
      #   node-03 ivgs-cogvideox-worker-node03 2048  (from .env.node03)
      #   node-04 ivgs-celery-node04           UNSET -> code default 4096
      # Four containers, two answers, and nothing anywhere saying which was
      # intended. `dev/CLAUDE.md` §6.3's trap governs: a value in an env file is
      # invisible in the tracked tree and does not reach an already-running
      # container -- measured here, `.env.node04` gained this variable at
      # 14:59:45 on 2026-08-28, 33 minutes AFTER the container that would have
      # read it was created, so node-04 has been running 4096 while its env file
      # claimed 2048. A compose-level `environment:` entry is visible in git AND
      # wins over `env_file:`, which closes both halves.
      #
      # ⛔ EVERY VALUE BELOW IS THE ONE THAT NODE IS ALREADY RUNNING. This
      # declaration moves no behaviour; it makes the running value legible.
      #
      # node-03: 2048, and INERT on this node. Its queues are gpu_video and
      # gpu_animation, and `get_vllm_config_for_stage` gives image/video/
      # animation a HARDCODED 4096 (config.py:437) without consulting this
      # variable at all. Declared anyway, at the value already running, so a
      # future stage landing on these queues inherits a stated number rather
      # than discovering one.
      IVGS_VLLM_MAX_TOKENS: "2048"
      REDIS_URL: redis://${NODE_01_IP}:6379/0
      # asyncpg, not psycopg: the workers image ships psycopg2 + asyncpg, not
      # psycopg (v3), and DATABASE_URL is consumed only by create_async_engine.
      # Ledger P1.0b.
      DATABASE_URL: postgresql+asyncpg://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs
      IVGS_GPU_SCHEDULER_URL: http://${NODE_01_IP}:8002
      SEAWEEDFS_FILER_URL: http://${NODE_01_IP}:8888
      NODE_HOSTNAME: node-03
      COGVIDEOX_URL: http://cogvideox-server:8200
      # WP-46. Wan2.2-Animate's engine key is `comfyui` (MBCP's SSOT value),
      # so resolve_endpoint('comfyui') reads IVGS_COMFYUI_URL — the same
      # variable node-04's worker uses to reach the FLUX image ComfyUI. Two
      # ComfyUI instances, one engine key, one endpoint map: they are told
      # apart by the PER-WORKER value of this variable, which is why this
      # worker must only ever consume gpu_video and gpu_animation. If an image
      # queue is ever added here, this line has to be revisited first — the
      # animation task's capability gate will refuse loudly either way.
      IVGS_COMFYUI_URL: http://wan-animate-server:8188
      VLLM_PRIMARY_URL: "http://vllm:8000"
      VLLM_SECONDARY_URL: "http://${NODE_03_IP}:${VLLM_PORT:-8000}"
      VLLM_MIDSIZE_URL: "http://${NODE_04_IP}:${VLLM_PORT:-8000}"
      IVGS_VLLM_MIDSIZE_MODEL: "mistral-24b"
      IVGS_VLLM_API_KEY: "${VLLM_API_KEY:-ivgs-internal}"
      IVGS_CELERY_RESULT_BACKEND: "db+postgresql+psycopg2://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs"
      IVGS_CELERY_BROKER_URL: "redis://${NODE_01_IP}:6379/0"
      # WP-05 / ledger P0.1: must exceed the longest hard task time_limit
      # (3900s, talking_head + video_generation). Asserted at worker startup.
      IVGS_BROKER_VISIBILITY_TIMEOUT: "7200"
      C_FORCE_ROOT: "1"
    volumes:
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    networks:
      - ivgs-net
    command: >
      celery -A celery_app worker
        --loglevel=info
        --queues=gpu_video,gpu_animation
        --concurrency=1
        --max-tasks-per-child=10
        -n cogvideox-worker@node03

  # ---------------------------------------------------------------------------
  # CogVideoX/Wan2.1 model server (HTTP). GPU + weights live HERE; the worker is
  # a thin client that reaches it at COGVIDEOX_URL over the ivgs-net network.
  # Runs the locally-built image (pull_policy: never) — no registry needed.
  # ---------------------------------------------------------------------------
  cogvideox-server:
    image: ghcr.io/brucecostello2/ivgs-workers:cogvideox-pilot-1  # pinned: only built cogvideox image (rebuild+retag to bump)
    container_name: ivgs-cogvideox-server-node03
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    environment:
      MODEL_VARIANT: cogvideox
      MODEL_PATH: /opt/models/cogvideox-5b     # local-staged weights (NOT /mnt NFS: mmap-over-NFS too slow)
      PORT: "8200"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /opt/models:/opt/models:ro
    ports:
      - "8200:8200"                            # optional host access; worker reaches it by service name
    networks:
      - ivgs-net
    shm_size: "8g"

  # ---------------------------------------------------------------------------
  # Wan2.2-Animate serving engine (WP-46). MBCP's CERTIFIED ComfyUI image,
  # pinned by digest and never substituted (AD-04-v3 envelope directive: the
  # digest carries the patches). It is a SECOND ComfyUI instance, not a change
  # to node-04's: the two live in different dependency eras — kijai's
  # WanVideoWrapper needs diffusers >= 0.33 while node-04's image is pinned to
  # 0.29.2 for CogVideoX/MimicMotion — and node-04's ComfyUI carries no custom
  # nodes at all (measured 2026-08-25: 761 node types, `{}` for every
  # WanVideo*, VHS_* and PoseAndFaceDetection class). Teaching it this graph
  # would mean a new image and six new mounts, i.e. recreating a running
  # engine container, which WP-46 forbids.
  #
  # Source: 192.168.1.51:5000/mbcp/comfyui-wan
  #         @sha256:58752ff6d84912d82e7f52d484ec84ec70829951c3e88c1592a12407604d62e2
  #         (MBCP deploy/images.env, MBCP_COMFYUI_WAN_IMAGE)
  # `pull_policy: never` — the image is in node-03's local store; the MBCP
  # registry is not on the deploy path, exactly as cogvideox-server is not.
  #
  # Weights are mounted READ-ONLY from the .51-materialized tree, in the layout
  # MBCP's materialization map defines (mbcp_core/weights/materialization.py,
  # ENGINE_MATERIALIZATION["comfyui-wan"]). The engine writes nothing
  # persistent: outputs are fetched over /view and persisted by the worker.
  # ---------------------------------------------------------------------------
  wan-animate-server:
    image: 192.168.1.51:5000/mbcp/comfyui-wan@sha256:58752ff6d84912d82e7f52d484ec84ec70829951c3e88c1592a12407604d62e2
    container_name: ivgs-wan-animate-server-node03
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    volumes:
      - /opt/models/comfyui-wan/models/diffusion_models:/app/ComfyUI/models/diffusion_models:ro
      - /opt/models/comfyui-wan/models/text_encoders:/app/ComfyUI/models/text_encoders:ro
      - /opt/models/comfyui-wan/models/vae:/app/ComfyUI/models/vae:ro
      - /opt/models/comfyui-wan/models/clip_vision:/app/ComfyUI/models/clip_vision:ro
      - /opt/models/comfyui-wan/models/detection:/app/ComfyUI/models/detection:ro
      - /opt/models/comfyui-wan/models/loras:/app/ComfyUI/models/loras:ro
      - /opt/models/comfyui-wan/models/sam2:/app/ComfyUI/models/sam2:ro
      - /opt/models/comfyui-wan/models/onnx:/app/ComfyUI/models/onnx:ro
    ports:
      - "8220:8188"                            # host/cross-node access; the
                                               # worker reaches it by service
                                               # name on :8188
    networks:
      - ivgs-net
    shm_size: "8g"
    # No healthcheck override: the image ships one (HTTP root, 90s start
    # period), and a 14B fp8 model takes most of that to become answerable.
    #
    # NOT in cogvideox-worker's depends_on, deliberately. depends_on only
    # orders startup, the worker resolves this endpoint lazily at task time,
    # and every entry widens what a `docker compose up <service>` without
    # --no-deps reaches. node-04's celery-worker already demonstrates that
    # hazard (dev/CLAUDE.md section 6).

  # ---------------------------------------------------------------------------
  # Service 3: Celery Worker (LLM + video queues)
  # Handles LLM inference tasks dispatched to this node
  # ---------------------------------------------------------------------------
  celery-worker:
    profiles: ["standby"]
    image: ghcr.io/brucecostello2/ivgs-workers:${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-celery-node03
    <<: [*common-restart, *common-logging]
    env_file:
      - .env.node03
    environment:
      REDIS_URL: redis://${NODE_01_IP}:6379/0
      # asyncpg, not psycopg: the workers image ships psycopg2 + asyncpg, not
      # psycopg (v3), and DATABASE_URL is consumed only by create_async_engine.
      # Ledger P1.0b.
      DATABASE_URL: postgresql+asyncpg://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs
      VLLM_PRIMARY_URL: http://vllm:8000
      VLLM_SECONDARY_URL: "http://${NODE_03_IP}:${VLLM_PORT:-8000}"
      VLLM_MIDSIZE_URL: "http://${NODE_04_IP}:${VLLM_PORT:-8000}"
      OLLAMA_URL: "http://${NODE_05_IP}:${OLLAMA_PORT:-11434}"
      COMFYUI_PRIMARY_URL: "http://${NODE_04_IP}:${COMFYUI_PORT:-8188}"
      COMFYUI_FALLBACK_URL: "http://${NODE_05_IP}:${COMFYUI_PORT:-8188}"
      COQUI_TTS_URL: "http://${NODE_04_IP}:${COQUI_TTS_PORT:-8020}"
      IVGS_VLLM_API_KEY: "${VLLM_API_KEY:-ivgs-internal}"
      IVGS_CELERY_RESULT_BACKEND: "db+postgresql+psycopg2://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs"
      IVGS_CELERY_BROKER_URL: "redis://${NODE_01_IP}:6379/0"
      # WP-05 / ledger P0.1: must exceed the longest hard task time_limit
      # (3900s, talking_head + video_generation). Asserted at worker startup.
      IVGS_BROKER_VISIBILITY_TIMEOUT: "7200"
      API_BASE_URL: "http://${NODE_01_IP}:8001"
      IVGS_GPU_SCHEDULER_URL: http://${NODE_01_IP}:8002
      SEAWEEDFS_FILER_URL: http://${NODE_01_IP}:8888
      NODE_HOSTNAME: node-03
      C_FORCE_ROOT: "1"
    volumes:
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    networks:
      - ivgs-net
    command: >
      celery -A celery_app worker
        --loglevel=info
        --queues=gpu_llm
        --concurrency=2
        --max-tasks-per-child=50
        -n celery-worker@node03

  # ---------------------------------------------------------------------------
  # Service 4: Node Exporter (§13.1 Table 13-1 Row 3, port 9100)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ivgs-node-exporter
    <<: [*common-restart, *common-logging]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "0.0.0.0:9100:9100"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  # ---------------------------------------------------------------------------
  # Service 5: NVIDIA GPU Exporter (§13.1 Table 13-1 Row 4, port 9400)
  # GPU utilization %, VRAM used/total, temperature, power, clock speeds
  # ---------------------------------------------------------------------------
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    container_name: ivgs-nvidia-gpu-exporter
    <<: [*common-restart, *common-logging, *gpu-resources]
    ports:
      - "0.0.0.0:9400:9400"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9400/metrics || exit 1"]
