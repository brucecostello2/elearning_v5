# =============================================================================
# IVGS v5 — Prometheus Configuration
# =============================================================================
# Spec reference: §13.1 Table 13-1 — Prometheus Scrape Targets
#
# Scrape interval: 15 seconds (per §13.1)
# Retention: 30 days (per §13.1)
# Targets:
#   1. ivgs-api          — node-01:8000/metrics
#   2. ivgs-scheduler    — node-01:8001/metrics
#   3. node-exporter     — all nodes :9100/metrics
#   4. nvidia-gpu-exporter — nodes 02-06 :9400/metrics
#   5. (was intel-gpu-exporter on node-06:9401 — removed 2026-08-25, WP-53;
#      the card is NVIDIA, see Group 4)
#   6. postgres-exporter   — node-01:9187/metrics
#   7. redis-exporter      — node-01:9121/metrics
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: "ivgs-v5"
    environment: "production"

# ---------------------------------------------------------------------------
# Alertmanager
# ---------------------------------------------------------------------------
# Without this block Prometheus evaluates every rule in alert_rules.yml and
# routes the results nowhere. BackupFailed had been firing correctly and
# reaching nobody -- it was firing at the moment this was added on 2026-08-14.
#
# Resolved by Docker's embedded DNS at 127.0.0.11. Prometheus's Go resolver
# uses it directly; note that `getent`/`wget` inside the prom image cannot,
# so shell-based DNS tests from that container are misleading.
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

# ---------------------------------------------------------------------------
# Scrape Target Group 1: IVGS API (§13.1 Row 1)
# Metrics: API request latency, pipeline job counts, DLQ size,
#          quality score distributions
# ---------------------------------------------------------------------------
scrape_configs:
  - job_name: "ivgs-api"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      # WP-53: LEFT AS IS, and this is deliberate. The other four node-01
      # targets were dead because of ufw and container DNS fixes them. This one
      # is not: measured 2026-08-25, `ivgs-api` serves NO Prometheus endpoint at
      # all. It imports no prometheus_client and registers no /metrics route
      # (compare ivgs-scheduler/main.py:883, which does) — probed
      # /metrics, /api/metrics and /api/v1/metrics on the live container and all
      # three 404. The published port is 8001, not the 8000 written here.
      #
      # Pointing this at "ivgs-fastapi:8001" would turn a connection timeout
      # into a 404 and change nothing that matters, while making the target
      # LOOK addressed. Fixing it means giving the API a metrics endpoint,
      # which is code, not config. Ledger P2.62.
      - targets:
          - "node-01:8000"
        labels:
          service: "ivgs-api"
          node: "node-01"
          component: "api"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 2: IVGS GPU Scheduler (§13.1 Row 2, §12.4 Table 12-3)
  # Metrics: GPU queue depth, wait time, rejection rate, circuit breaker state,
  #          ivgs_scheduler_queue_depth, ivgs_scheduler_wait_time_seconds,
  #          ivgs_scheduler_rejection_total, ivgs_scheduler_circuit_breaker_state,
  #          ivgs_gpu_vram_used_mb, ivgs_gpu_utilization_pct
  # ---------------------------------------------------------------------------
  - job_name: "ivgs-scheduler"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      # WP-53 (P2.40). Was "node-01:8001" and DOWN with "context deadline
      # exceeded" for the ufw reason described in Group 3. Verified 2026-08-25
      # over container DNS from a peer on ivgs-infra_ivgs-net: 200, 7.7 KB,
      # prometheus_client output. The scheduler's endpoint is main.py:883.
      - targets:
          - "ivgs-scheduler:8001"
        labels:
          service: "ivgs-scheduler"
          node: "node-01"
          component: "scheduler"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 3: Node Exporter — All 6 Nodes (§13.1 Row 3)
  # Metrics: CPU, RAM, disk I/O, network I/O per node
  # ---------------------------------------------------------------------------
  - job_name: "node-exporter"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      # WP-53 (P2.40). Was "node-01:9100", which has been DOWN with
      # "context deadline exceeded" since this file was written: ufw admits only
      # 192.168.1.0/24 to the host and the compose bridge is 172.x, so a
      # container cannot reach node-01's own published ports. The container-DNS
      # remedy is the one WP-48 proved for node-01's log source and that
      # `pushgateway` below has been using successfully all along.
      #
      # NO ufw change is needed, contrary to what was expected: measured
      # 2026-08-25, `ivgs-node-exporter` is on ivgs-infra_ivgs-net (not host
      # networking) and answered 200 with 108 KB of metrics over container DNS.
      # It runs with --path.procfs=/host/proc --path.sysfs=/host/sys
      # --path.rootfs=/rootfs against host mounts, so these are HOST metrics,
      # not the container's.
      #
      # This one matters beyond tidiness: app/core/node_health.py reads
      # up{job="node-exporter"}, so node-01 has been rendering as `unknown` in
      # the Node Monitor — the healthiest machine in the fleet, unable to
      # observe itself.
      - targets:
          - "ivgs-node-exporter:9100"
        labels:
          node: "node-01"
          role: "infrastructure"
      - targets:
          - "node-02:9100"
        labels:
          node: "node-02"
          role: "llm-primary"
          gpu: "rtx-6000-blackwell"
      - targets:
          - "node-03:9100"
        labels:
          node: "node-03"
          role: "llm-secondary"
          gpu: "rtx-6000-blackwell"
      - targets:
          - "node-04:9100"
        labels:
          node: "node-04"
          role: "image-tts-talking-head"
          gpu: "rtx-5000-pro-blackwell"
      - targets:
          - "node-05:9100"
        labels:
          node: "node-05"
          role: "image-utility"
          gpu: "rtx-pro-5000-blackwell"   # WP-48: was rtx-5080; measured on the box
      - targets:
          - "node-06:9100"
        labels:
          node: "node-06"
          role: "remotion-compositor"
          # WP-53: was "intel-b70-pro". Measured 2026-08-25 — NVIDIA GeForce
          # RTX 5080, 16303 MiB, driver 580.173.02. This target is UP; only the
          # label was wrong.
          gpu: "nvidia-rtx-5080"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 4: NVIDIA GPU Exporter — Nodes 02-05 (§13.1 Row 4)
  # Metrics: GPU utilization %, VRAM used/total, temperature, power draw,
  #          clock speeds
  # ---------------------------------------------------------------------------
  - job_name: "nvidia-gpu-exporter"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "node-02:9400"
        labels:
          node: "node-02"
          gpu_model: "RTX 6000 Blackwell"
          vram_total_gb: "96"
      - targets:
          - "node-03:9400"
        labels:
          node: "node-03"
          gpu_model: "RTX 6000 Blackwell"
          vram_total_gb: "96"
      - targets:
          - "node-04:9400"
        labels:
          node: "node-04"
          gpu_model: "RTX 5000 Pro Blackwell"
          vram_total_gb: "48"
      - targets:
          - "node-05:9400"
        labels:
          node: "node-05"
          gpu_model: "RTX PRO 5000 Blackwell"   # WP-48: was "RTX 5080"
          # WP-53: was "16", left behind when WP-48 corrected the model on the
          # line above. nvidia-smi on the box reports 48935 MiB. node-05 is OUT
          # OF SERVICE as of 2026-08-25 (RAM fault, corrupting data under load)
          # so this target is down and correctly so; the label is fixed anyway
          # because a wrong capacity is wrong whether or not it is reachable.
          vram_total_gb: "48"
      # WP-53. node-06 moved here from the intel-gpu-exporter job, which has been
      # removed. It was registered as an INTEL exporter on :9401; the card is
      # NVIDIA, so that target could never have come up and never did. Measured
      # 2026-08-25 on the box: "NVIDIA GeForce RTX 5080", 16303 MiB, driver
      # 580.173.02 — a consumer 5080, NOT the RTX 6000 96 GB every document
      # claimed after the swap.
      #
      # This target will be DOWN until node-06 is provisioned. That is deliberate
      # and it is the honest state: node-06 answers on :9100 today and nothing
      # else, because it has never had docker-compose.telemetry.yml deployed and
      # has no /opt/ivgs. Registering it now means the target goes green the
      # moment the operator provisions it, with no config change to remember.
      - targets:
          - "node-06:9400"
        labels:
          node: "node-06"
          gpu_model: "NVIDIA GeForce RTX 5080"
          vram_total_gb: "16"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 5: REMOVED 2026-08-25 (WP-53).
  #
  # This was `intel-gpu-exporter` scraping node-06:9401, labelled
  # "Intel B70 Pro" / 32 GB. node-06 has not held an Intel card for some time
  # and holds an NVIDIA RTX 5080 today, so the target was scraping a port that
  # nothing has ever listened on — Prometheus has been reporting it DOWN for its
  # whole life and there was no configuration change that could have fixed it.
  #
  # node-06 now appears in Group 4 on :9400 with its measured card. Coverage
  # moved; it was not dropped. No alert rule referenced this job by name; the one
  # rule that referenced `intel_gpu_temperature_celsius` is handled in
  # alert_rules.yml.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Scrape Target Group 6: PostgreSQL Exporter (§13.1 Row 6)
  # Metrics: Connection pool, query latency, deadlock count, table bloat
  # ---------------------------------------------------------------------------
  - job_name: "postgres-exporter"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      # WP-53: LEFT AS IS. Like `ivgs-api` above, and unlike the two node-01
      # targets container DNS repaired, this one is not a networking problem:
      # measured 2026-08-25, there is NO postgres-exporter container on this host
      # (`docker ps -a` has none), so `postgres_exporter` has never been deployed.
      # Giving it a container name would point it at something that does not
      # exist. Ledger P2.62.
      - targets:
          - "node-01:9187"
        labels:
          service: "postgresql"
          node: "node-01"
          component: "database"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 7: Redis Exporter (§13.1 Row 7)
  # Metrics: Memory used, keyspace hits/misses, connected clients,
  #          queue lengths
  # ---------------------------------------------------------------------------
  - job_name: "redis-exporter"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      # WP-53: LEFT AS IS. Like `ivgs-api` above, and unlike the two node-01
      # targets container DNS repaired, this one is not a networking problem:
      # measured 2026-08-25, there is NO redis-exporter container on this host
      # (`docker ps -a` has none), so `redis_exporter` has never been deployed.
      # Giving it a container name would point it at something that does not
      # exist. Ledger P2.62.
      - targets:
          - "node-01:9121"
        labels:
          service: "redis"
          node: "node-01"
          component: "cache-broker"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+):\\d+"
        replacement: "${1}"

  # ---------------------------------------------------------------------------
  # Scrape Target Group 8: Prometheus Pushgateway (§14.1, §13.1)
  # Receives push-based metrics from backup scripts (backup.sh, wal_archive.sh,
  # config_backup.sh, verify_backup.sh). Prometheus pulls from pushgateway,
  # scripts push to it.
  # honor_labels: true preserves backup_type/node labels set by the scripts.
  # ---------------------------------------------------------------------------
  - job_name: "pushgateway"
    metrics_path: "/metrics"
    scrape_interval: 30s
    honor_labels: true
    static_configs:
      - targets:
          - "pushgateway:9091"
        labels:
          service: "pushgateway"
          node: "node-01"
          component: "metric-ingestion"
