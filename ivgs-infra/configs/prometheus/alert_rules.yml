# =============================================================================
# IVGS v5 — Prometheus Alert Rules
# =============================================================================
# Spec reference: §13.3 Table 13-3 — Prometheus Alert Rules
#
# Alert inventory (11 rules):
#   Critical (immediate action required):
#     1. GPUOvertemperature   — GPU temp >85°C for 2min
#     2. WorkerDown           — Worker heartbeat missing for 5min
#     3. DLQHighCount         — DLQ messages >10 for 5min
#     4. JobFailureRateHigh   — Job failure rate >10% for 15min
#     5. BackupFailed         — Last backup status = failed (instant)
#
#   Warning (investigation required):
#     6. GPUUtilizationLow    — Fleet avg GPU util <30% for 15min
#     7. RenderQueueBacklog   — Pending render segments >20 for 5min
#     8. GPUVRAMHigh          — VRAM utilization >90% for 5min
#     9. NodeHighCPU          — CPU utilization >85% for 5min
#    10. NodeHighRAM          — RAM utilization >90% for 5min
#
#   Informational:
#    11. StorageQuotaAlert    — User quota >80% full for 1hr
# =============================================================================

groups:
  # =========================================================================
  # Group 1: Critical Alerts — Require Immediate Action
  # =========================================================================
  - name: ivgs_critical_alerts
    interval: 15s
    rules:
      # -----------------------------------------------------------------------
      # Alert 1: GPUOvertemperature (Table 13-3 Row 1)
      # Condition: GPU temperature >85°C
      # Duration: 2 minutes
      # Severity: Critical
      # Action: Page on-call; consider draining node
      # -----------------------------------------------------------------------
      # CORRECTED 2026-08-25 (WP-53). This alert could never fire.
      #
      # It matched `nvidia_gpu_temperature_celsius` OR
      # `intel_gpu_temperature_celsius`. NEITHER SERIES EXISTS. Queried against
      # the live Prometheus the same day, the only GPU temperature series in the
      # instance is `nvidia_smi_temperature_gpu` (the nvidia-gpu-exporter's
      # actual metric name, up on node-02/03/04); `intel_*` returns nothing at
      # all, and `DCGM_FI_DEV_GPU_TEMP` is a stale name in the label index with
      # zero live series.
      #
      # So a CRITICAL page-on-call rule for GPU overtemperature has been
      # evaluating to empty on every cycle since it was written. It did not
      # fail, it did not warn: an alert that matches nothing looks exactly like
      # an alert whose condition is not met.
      #
      # The intel leg is dropped with the intel-gpu-exporter job (prometheus.yml
      # Group 5) -- node-06 is NVIDIA. Safe to enable: the three live GPUs read
      # 29-35 C at the time of the change, nowhere near the 85 C threshold.
      - alert: GPUOvertemperature
        expr: |
          nvidia_smi_temperature_gpu > 85
        for: 2m
        labels:
          severity: critical
          team: infrastructure
          component: gpu
        annotations:
          summary: "GPU overtemperature on {{ $labels.node }} ({{ $labels.gpu_model }})"
          description: >-
            GPU temperature on node {{ $labels.node }} has exceeded 85°C
            threshold. Current temperature: {{ $value | printf "%.1f" }}°C.
            GPU model: {{ $labels.gpu_model }}.
            This sustained temperature may cause thermal throttling or hardware
            damage. Consider draining the node and investigating cooling.
          action: "Page on-call engineer. Consider draining node via POST /drain/{{ $labels.node }}."
          runbook: "docs/runbooks/gpu-overtemperature.md"
          dashboard: "https://i.ytimg.com/vi/5WcfzHtfvuo/sddefault.jpg $labels.node }}"

      # -----------------------------------------------------------------------
      # Alert 2: WorkerDown (Table 13-3 Row 2)
      # Condition: Worker heartbeat missing
      # Duration: 5 minutes
      # Severity: Critical
      # Action: Auto-reschedule jobs; alert ops
      # -----------------------------------------------------------------------
      # WP-55 (P2.64): this rule now HAS a metric. `ivgs_worker_last_heartbeat_timestamp`
      # Written by every worker's liveness beacon (ivgs-workers/utils/liveness.py) and exported by ivgs-api /api/v1/metrics. UNIT: unix SECONDS, the same unit as time(), so the 300 threshold is 300 seconds.
      # It was inert from the day it was written until 2026-08-25.
      - alert: WorkerDown
        expr: |
          time() - ivgs_worker_last_heartbeat_timestamp > 300
        for: 5m
        labels:
          severity: critical
          team: infrastructure
          component: worker
        annotations:
          summary: "Worker {{ $labels.worker_id }} on {{ $labels.node }} is down"
          description: >-
            Worker {{ $labels.worker_id }} on node {{ $labels.node }} has not
            sent a heartbeat in over 5 minutes. Last heartbeat was
            {{ $value | printf "%.0f" }} seconds ago. Any active jobs on this
            worker should be automatically rescheduled by the GPU scheduler.
          action: "Auto-reschedule active jobs. Investigate worker process on {{ $labels.node }}."
          runbook: "docs/runbooks/worker-down.md"

      # -----------------------------------------------------------------------
      # Alert 3: DLQHighCount (Table 13-3 Row 3)
      # Condition: DLQ messages >10
      # Duration: 5 minutes
      # Severity: Critical
      # Action: Alert ops for investigation
      # -----------------------------------------------------------------------
      # WP-55 (P2.64): this rule now HAS a metric. `ivgs_dlq_message_count`
      # Exported by ivgs-api /api/v1/metrics from dead_letter_messages WHERE resolution IS NULL. UNIT: a count, the same unit as the 10 threshold.
      # It was inert from the day it was written until 2026-08-25.
      - alert: DLQHighCount
        expr: |
          ivgs_dlq_message_count > 10
        for: 5m
        labels:
          severity: critical
          team: operations
          component: dlq
        annotations:
          summary: "DLQ message count is {{ $value }} (threshold: 10)"
          description: >-
            The Dead Letter Queue contains {{ $value }} unresolved messages,
            exceeding the threshold of 10. This indicates persistent pipeline
            failures that have exhausted all retry and fallback attempts.
            Investigate the error patterns and root causes immediately.
          action: "Review DLQ entries via GET /api/v1/dlq/messages. Check error_category distribution."
          runbook: "docs/runbooks/dlq-high-count.md"
          dashboard: "https://grafana.com/media/docs/grafana-cloud/screenshot-faro-errors_overview.png"

      # -----------------------------------------------------------------------
      # Alert 4: JobFailureRateHigh (Table 13-3 Row 4)
      # Condition: Job failure rate >10%
      # Duration: 15 minutes
      # Severity: Critical
      # Action: Investigate pipeline errors
      # -----------------------------------------------------------------------
      # WP-55 (P2.64): this rule now HAS a metric. `ivgs_pipeline_jobs_failed_total / _total`
      # Exported by ivgs-api /api/v1/metrics from render_jobs. UNIT: counts; the expression divides them and scales by 100, so the 10 threshold is 10 PERCENT.
      # It was inert from the day it was written until 2026-08-25.
      - alert: JobFailureRateHigh
        expr: |
          (
            sum(rate(ivgs_pipeline_jobs_failed_total[5m]))
            /
            clamp_min(sum(rate(ivgs_pipeline_jobs_total[5m])), 0.001)
          ) * 100 > 10
        for: 15m
        labels:
          severity: critical
          team: operations
          component: pipeline
        annotations:
          summary: "Pipeline job failure rate is {{ $value | printf \"%.1f\" }}% (threshold: 10%)"
          description: >-
            The pipeline job failure rate over the past 5 minutes has exceeded
            10%, sustained for 15 minutes. Current rate: {{ $value | printf "%.1f" }}%.
            This may indicate a systemic issue such as a model crash, resource
            exhaustion, or infrastructure degradation.
          action: "Check pipeline stage error distribution. Review recent DLQ entries for patterns."
          runbook: "docs/runbooks/job-failure-rate-high.md"
          dashboard: "https://docs.netscaler.com/en-us/citrix-adc/media/grafana-dashboard.png"

      # -----------------------------------------------------------------------
      # Alert 5: BackupFailed (Table 13-3 Row 11)
      # Condition: Last backup status = failed
      # Duration: instant (no 'for' — fires immediately)
      # Severity: Critical
      # Action: Alert ops immediately
      # -----------------------------------------------------------------------
      - alert: BackupFailed
        expr: |
          ivgs_backup_last_status == 0
        labels:
          severity: critical
          team: infrastructure
          component: backup
        annotations:
          summary: "Backup failed for {{ $labels.backup_type }} on {{ $labels.node }}"
          description: >-
            The last {{ $labels.backup_type }} backup completed with a failure
            status. Backup target: {{ $labels.target_path }}. This is a critical
            data protection issue that must be investigated immediately.
            Check backup logs at /var/log/ivgs/backup.log for details.
          action: "Investigate backup failure. Check disk space, GPG keys, and network connectivity to NAS."
          runbook: "docs/runbooks/backup-failed.md"

      # -----------------------------------------------------------------------
      # Alert 5b: BackupStale
      # Condition: no backup of a given type has reported in for over 26 hours
      # Duration: instant (see below)
      # Severity: Critical
      # Action: Alert ops immediately
      #
      # WHY THIS EXISTS. BackupFailed above catches "a backup ran and failed".
      # It cannot catch "no backup ran at all", which is the failure mode that
      # actually occurred: the pushgateway retains the last pushed value
      # indefinitely, so if the schedule stops after a success the gauge holds
      # 1 forever and nothing contradicts it. Between 2026-05-29 and 2026-08-14
      # the database backup did not run to completion once, and no alert could
      # have said so from ivgs_backup_last_status alone.
      #
      # Shape is taken from WorkerDown (this file, ~line 68), which applies the
      # same time()-minus-timestamp test to worker heartbeats.
      #
      # 26h, not 24h, so a daily 02:00 backup that is merely slow or briefly
      # delayed does not page anyone. No `for:` clause: the expression is a
      # timestamp comparison and cannot flap, and BackupFailed is likewise
      # instant -- an inhibit_rule in alertmanager.yml stops the two from
      # double-paging for the same backup_type.
      # -----------------------------------------------------------------------
      - alert: BackupStale
        expr: |
          time() - ivgs_backup_last_timestamp > 93600
        labels:
          severity: critical
          team: infrastructure
          component: backup
        annotations:
          summary: "No {{ $labels.backup_type }} backup in over 26 hours on node-01"
          description: >-
            No {{ $labels.backup_type }} backup has reported a completion
            timestamp for more than 26 hours. This means the backup is not
            running at all -- distinct from BackupFailed, which means it ran
            and failed. Check the Celery beat schedule in
            ivgs-backup-worker/celery_app.py for the database backup, and the
            root crontab for asset and config backups.
          action: "Confirm the schedule is firing before assuming the backup itself is broken."
          runbook: "docs/runbooks/backup-failed.md"

  # =========================================================================
  # Group 2: Warning Alerts — Require Investigation
  # =========================================================================
  - name: ivgs_warning_alerts
    interval: 15s
    rules:
      # -----------------------------------------------------------------------
      # Alert 6: GPUUtilizationLow (Table 13-3 Row 5)
      # Condition: Fleet avg GPU util <30%
      # Duration: 15 minutes
      # Severity: Warning
      # Action: Review queue backlog
      # -----------------------------------------------------------------------
      # CORRECTED 2026-08-25 (WP-54). `nvidia_gpu_utilization_pct` is produced by
      # nothing on this fleet -- the name appears in no exporter and nowhere in
      # the IVGS tree. The live exporter emits `nvidia_smi_utilization_gpu_ratio`.
      #
      # THE UNIT CHANGE IS NOT COSMETIC. The exporter's metric is a RATIO in
      # [0, 1]; the rule and its annotation are written in PERCENT. A bare
      # rename would have compared a ratio against 30 and been true for every
      # possible value the metric can take -- an alert that cannot stop firing,
      # which is the mirror image of the one that cannot start. It would have
      # looked correct today only because an idle fleet reads 0 either way.
      - alert: GPUUtilizationLow
        expr: |
          avg(nvidia_smi_utilization_gpu_ratio) * 100 < 30
        for: 15m
        labels:
          severity: warning
          team: operations
          component: gpu
        annotations:
          summary: "Fleet average GPU utilization is {{ $value | printf \"%.1f\" }}% (threshold: 30%)"
          description: >-
            The average GPU utilization across the NVIDIA fleet has been below
            30% for 15 minutes. Current average: {{ $value | printf "%.1f" }}%.
            This may indicate underutilization, a queue starvation issue,
            or a scheduler problem preventing job dispatch.
          action: "Review queue backlogs via GET /fleet. Check if scheduler is dispatching jobs."
          runbook: "docs/runbooks/gpu-utilization-low.md"
          dashboard: "https://lh7-us.googleusercontent.com/7QbIMIhexpC9-7WFX8HJEZMlsgSJqMA2MkILUZs5DZmgsB0OgphCGaO6xNumeqYdPs1rx2Il2V7FFjfk9dhWBCYVTkpkhBEwrzEJgnlvmBG_oBgY_Nk8x4pT6UY7nOvAehxfBtRLn8YlAE_FvDWyjww"

      # -----------------------------------------------------------------------
      # Alert 7: RenderQueueBacklog (Table 13-3 Row 6)
      # Condition: Pending render segments >20
      # Duration: 5 minutes
      # Severity: Warning
      # Action: Consider scaling workers
      # -----------------------------------------------------------------------
      # WP-55 (P2.64): this rule now HAS a metric. `ivgs_render_queue_pending_segments`
      # Exported by ivgs-api /api/v1/metrics from render_segments WHERE status='pending'. UNIT: a count, the same unit as the 20 threshold.
      # It was inert from the day it was written until 2026-08-25.
      - alert: RenderQueueBacklog
        expr: |
          ivgs_render_queue_pending_segments > 20
        for: 5m
        labels:
          severity: warning
          team: operations
          component: pipeline
        annotations:
          summary: "Render queue backlog is {{ $value }} segments (threshold: 20)"
          description: >-
            There are {{ $value }} pending render segments in the queue,
            exceeding the threshold of 20. This backlog has persisted for
            5 minutes. Rendering may be bottlenecked by available GPU capacity
            on nodes 05 and 06.
          action: "Consider scaling Remotion/FFmpeg workers. Check node-05 and node-06 capacity."
          runbook: "docs/runbooks/render-queue-backlog.md"

      # -----------------------------------------------------------------------
      # Alert 8: GPUVRAMHigh (Table 13-3 Row 7)
      # Condition: VRAM utilization >90%
      # Duration: 5 minutes
      # Severity: Warning
      # Action: Check for reservation leaks
      # -----------------------------------------------------------------------
      # CORRECTED 2026-08-25 (WP-54). `nvidia_gpu_memory_used_bytes` /
      # `_total_bytes` are produced by nothing on this fleet. The live exporter
      # emits `nvidia_smi_memory_used_bytes` / `nvidia_smi_memory_total_bytes`,
      # in the same unit, so this one is a straight rename.
      #
      # It fires immediately on node-02, and that is a TRUE positive, measured
      # at the time of the change: 92792684544 / 102641958912 = 90.4%. vLLM
      # preallocates its KV cache, so a node serving an LLM sits near the top of
      # VRAM by design. The alert has been incapable of saying so for its whole
      # life; the first thing it does once repaired is report a real condition.
      # WP-55 (WP-54 D-2, RULED). SCOPED TO role="image", and joined by two
      # sibling rules below rather than replaced by them.
      #
      # This rule was fleet-wide and fired continuously on node-02 — correctly,
      # and uselessly. Measured 2026-08-25: node-02 90.4% used with 8.55 GiB
      # free and FLAT over an hour (min_over_time == current), because vLLM
      # preallocates its KV cache; node-03 21.7%; node-04 28.5%. One threshold
      # cannot mean the same thing on all three.
      #
      # The threshold is NOT raised and the rule is NOT deleted. It keeps its
      # name and its 90% and now applies to the role whose steady state is low
      # enough for 90% to be a signal. node-02 stays covered, by
      # GPULLMNodeFreeVRAMLow; node-03 by GPUVRAMSaturatedVideoNode.
      #
      # `for` 5m -> 10m: image generation legitimately spikes for the length of
      # a batch, and a rule that pages on a normal batch gets muted.
      - alert: GPUVRAMHigh
        expr: |
          (nvidia_smi_memory_used_bytes{role="image"} / nvidia_smi_memory_total_bytes{role="image"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
          team: infrastructure
          component: gpu
        annotations:
          summary: "VRAM utilization >90% on {{ $labels.node }} ({{ $value | printf \"%.1f\" }}%)"
          description: >-
            VRAM utilization on node {{ $labels.node }} ({{ $labels.gpu_model }})
            has exceeded 90% for 5 minutes. Current usage:
            {{ $value | printf "%.1f" }}%. This may indicate a VRAM reservation
            leak (expired reservations not released) or oversized model loading.
          action: "Check gpu_reservations table for expired entries. Verify model VRAM budgets per Appendix B."
          runbook: "docs/runbooks/gpu-vram-high.md"
          dashboard: "https://mintcdn.com/coreweave-dbfa0e8d/bmSvzayNAcGFdaNU/observability/managed-grafana/_media/cabinet-visualizer-overview.png?fit=max&auto=format&n=bmSvzayNAcGFdaNU&q=85&s=922ff184b0634c315815a69784d3f780 $labels.node }}"

      # -----------------------------------------------------------------------
      # Alert 9: NodeHighCPU (Table 13-3 Row 8)
      # Condition: CPU utilization >85%
      # Duration: 5 minutes
      # Severity: Warning
      # Action: Identify runaway process
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # WP-55: VRAM saturation on the VIDEO node.
      # CogVideoX and Wan-Animate are co-resident on node-03 and the profile is
      # legitimately high and spiky, so the level is the same 90%-class question
      # but the DURATION is what separates a long render from a stuck one.
      # 95% for 30m: a render that has held 95% for half an hour is not a
      # render, and 30m is longer than any single clip this pipeline produces.
      # -----------------------------------------------------------------------
      - alert: GPUVRAMSaturatedVideoNode
        expr: |
          (nvidia_smi_memory_used_bytes{role="video"} / nvidia_smi_memory_total_bytes{role="video"}) * 100 > 95
        for: 30m
        labels:
          severity: warning
          team: infrastructure
          component: gpu
        annotations:
          summary: "VRAM on {{ $labels.node }} (video) has held >95% for 30m ({{ $value | printf \"%.1f\" }}%)"
          description: >-
            node {{ $labels.node }} serves CogVideoX and Wan-Animate co-resident,
            so high VRAM during a render is expected and is not alerted on. This
            fires only on SUSTAINED saturation: 95% held for 30 minutes, which is
            longer than any single clip this pipeline renders. Check for a job
            that failed without releasing, or two engines loaded at once.
          action: "Check running renders on {{ $labels.node }}; look for a stuck job holding VRAM."
          runbook: "docs/runbooks/gpu-vram-high.md"

      # -----------------------------------------------------------------------
      # WP-55: HEADROOM, not level, on the LLM node.
      #
      # A level threshold measures the allocator, not the health. vLLM takes its
      # KV cache at startup and holds it: node-02 reads 90.4% used the moment it
      # is idle and would read the same under load, so "used %" carries almost
      # no information about whether the node can serve. What matters is whether
      # there is enough left to admit work.
      #
      # 4 GiB, chosen against measurement rather than intuition: node-02's free
      # VRAM is 8.55 GiB and flat, so this sits comfortably below its steady
      # state (it is healthy today, and capable of firing) while still being a
      # real floor — a 96 GB card with under 4 GiB free cannot load anything.
      # -----------------------------------------------------------------------
      - alert: GPULLMNodeFreeVRAMLow
        expr: |
          nvidia_smi_memory_free_bytes{role="llm"} < 4294967296
        for: 15m
        labels:
          severity: warning
          team: infrastructure
          component: gpu
        annotations:
          summary: "Free VRAM on {{ $labels.node }} (LLM) is {{ $value | humanize1024 }}B, under the 4 GiB floor"
          description: >-
            node {{ $labels.node }} runs vLLM, which preallocates its KV cache,
            so a high USED percentage is its normal resting state and is not
            alerted on. This fires on HEADROOM instead: free VRAM under 4 GiB
            for 15 minutes means the node cannot admit further work. Check for a
            second model loaded alongside the primary, or a leaked allocation.
          action: "Inspect vLLM on {{ $labels.node }}; check for a second loaded model."
          runbook: "docs/runbooks/gpu-vram-high.md"

      - alert: NodeHighCPU
        expr: |
          (
            1 - avg by (instance, node) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            )
          ) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: infrastructure
          component: system
        annotations:
          summary: "High CPU utilization on {{ $labels.node }}: {{ $value | printf \"%.1f\" }}%"
          description: >-
            CPU utilization on node {{ $labels.node }} has been above 85%
            for 5 minutes. Current utilization: {{ $value | printf "%.1f" }}%.
            This may be caused by a runaway process, excessive concurrent
            tasks, or a resource leak.
          action: "SSH to {{ $labels.node }} and run 'top -bn1 | head -20' to identify the process."
          runbook: "docs/runbooks/node-high-cpu.md"

      # -----------------------------------------------------------------------
      # Alert 10: NodeHighRAM (Table 13-3 Row 9)
      # Condition: RAM utilization >90%
      # Duration: 5 minutes
      # Severity: Warning
      # Action: Check for memory leaks
      # -----------------------------------------------------------------------
      - alert: NodeHighRAM
        expr: |
          (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) * 100 > 90
        for: 5m
        labels:
          severity: warning
          team: infrastructure
          component: system
        annotations:
          summary: "High RAM utilization on {{ $labels.node }}: {{ $value | printf \"%.1f\" }}%"
          description: >-
            RAM utilization on node {{ $labels.node }} has been above 90%
            for 5 minutes. Current utilization: {{ $value | printf "%.1f" }}%.
            Available memory: {{ with printf "node_memory_MemAvailable_bytes{node='%s'}" $labels.node | query }}{{ . | first | value | humanize }}{{ end }}.
            This may indicate a memory leak in a worker process or insufficient
            RAM allocation for the workload.
          action: "Check process memory usage: 'ps aux --sort=-%mem | head -20' on {{ $labels.node }}."
          runbook: "docs/runbooks/node-high-ram.md"

  # =========================================================================
  # Group 3: Informational Alerts
  # =========================================================================
  - name: ivgs_info_alerts
    interval: 60s
    rules:
      # -----------------------------------------------------------------------
      # Alert 11: StorageQuotaAlert (Table 13-3 Row 10)
      # Condition: User quota >80% full
      # Duration: 1 hour
      # Severity: Info
      # Action: Notify user via dashboard
      # -----------------------------------------------------------------------
      # ⛔ NO METRIC BEHIND THIS RULE. Measured 2026-08-25 (WP-54): `ivgs_user_storage_used_bytes` and `ivgs_user_storage_quota_bytes`
      # are produced by no target on this fleet, and the names appear
      # nowhere in the IVGS tree either -- they were written against
      # §13.1 Table 13-3, the design, and nothing was ever built to emit them.
      # This rule has therefore never been capable of firing.
      #
      # KEPT DELIBERATELY, not deleted. The data exists: `storage_quotas` is a real table (0 rows).
      # The gap is an EXPORTER, not a rule: deleting the rule would remove the
      # only record that the fleet is supposed to be watching this. Root cause
      # is shared with WP-53's P2.62 -- `ivgs-api` serves no /metrics endpoint
      # at all -- which is where all five of these belong. Ledger P2.64.
      - alert: StorageQuotaAlert
        expr: |
          (ivgs_user_storage_used_bytes / ivgs_user_storage_quota_bytes) * 100 > 80
        for: 1h
        labels:
          severity: info
          team: operations
          component: storage
        annotations:
          summary: "Storage quota >80% for user {{ $labels.user_id }}"
          description: >-
            User {{ $labels.user_id }} ({{ $labels.username }}) has used
            {{ $value | printf "%.1f" }}% of their storage quota.
            Used: {{ with printf "ivgs_user_storage_used_bytes{user_id='%s'}" $labels.user_id | query }}{{ . | first | value | humanize1024 }}{{ end }}.
            Quota: {{ with printf "ivgs_user_storage_quota_bytes{user_id='%s'}" $labels.user_id | query }}{{ . | first | value | humanize1024 }}{{ end }}.
            The user should be notified via dashboard to manage their storage.
          action: "Notify user via dashboard notification. Review retention policies."
          runbook: "docs/runbooks/storage-quota-alert.md"
