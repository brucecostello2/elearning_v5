# =============================================================================
# IVGS v5 - node-logs allowlist  (WP-48-TELEMETRY, Task 3)
# =============================================================================
# A two-route, GET-only window onto this node's Docker engine, so that the Node
# Monitor detail panel can show REAL logs from a node node-01 has no shell on.
#
# The threat this is written against: the obvious way to do this is to publish
# the Docker socket (or tecnativa/docker-socket-proxy with CONTAINERS=1), and
# both of those hand the LAN `GET /containers/<id>/json` - which returns
# `Config.Env`, i.e. every token and password the container was started with.
# That is a materially worse trade than the problem it solves. So the allowlist
# below is positive, not negative: two exact routes, everything else 403.
#
#   GET  /containers/json            container list  (Names, Image, State, Status)
#   GET  /containers/<id>/logs       that container's logs
#
# Refused: /containers/<id>/json (inspect - the env leak), /exec, /images,
# /volumes, /secrets, /info, /version, and every non-GET method.
#
# `user root` is required: the socket is root:docker 0660 and an nginx worker
# running as `nginx` gets EACCES on connect(). The worker's reachable surface is
# this file's two locations.
# =============================================================================

user  root;
worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  64;
}

http {
    access_log  off;
    server_tokens  off;

    # Docker Engine API over its unix socket.
    upstream docker_engine {
        server unix:/var/run/docker.sock;
    }

    server {
        listen       9430;
        server_name  _;

        # Log payloads can be large; the API asks for a bounded tail.
        client_max_body_size  1k;
        proxy_http_version    1.1;
        proxy_set_header      Host localhost;
        proxy_set_header      Connection "";
        # Do not buffer: `follow=1` must arrive as it is produced, and a large
        # tail must not be spooled to disk first.
        proxy_buffering       off;
        proxy_read_timeout    300s;

        # --- route 1: the container list -----------------------------------
        location = /containers/json {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker_engine;
        }

        # --- route 2: one container's logs ---------------------------------
        # The id segment is deliberately narrow: docker names and ids only.
        # It cannot match `/containers/<id>/json`, `/containers/<id>/exec` or
        # any other sub-resource, because the regex anchors on /logs$.
        location ~ "^/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/logs$" {
            limit_except GET HEAD { deny all; }
            proxy_pass http://docker_engine;
        }

        # --- everything else ------------------------------------------------
        location / {
            default_type application/json;
            return 403 '{"message":"forbidden by ivgs node-logs allowlist: only GET /containers/json and GET /containers/<id>/logs are served"}';
        }
    }
}
