# IVGS v5 — Alertmanager Configuration
#
# Lives in configs/ because that is the tree Prometheus actually mounts --
# `docker inspect ivgs-prometheus` shows /opt/ivgs/ivgs-infra/configs/prometheus/.
# The monitoring/ tree holds an identical copy; keep them in sync.
#
# Routes alerts from Prometheus to the IVGS API's webhook receiver
# (ivgs-api/app/api/v1/alerts.py), which logs them at WARNING and republishes
# them on the Redis channel `ivgs:alerts` for the dashboard's WebSocket
# consumers. That path needs no external credentials, which is why it is the
# default here.
#
# NOTE ON THE WEBHOOK HOST. The previous, never-deployed copy of this file
# pointed at `http://ivgs-api:8001/`. That hostname does not exist: the
# container is `ivgs-fastapi` with aliases [ivgs-fastapi, fastapi-backend], and
# `ivgs-api` does not resolve on ivgs-net (verified 2026-08-14). Alertmanager
# would have accepted the config and silently failed every delivery.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-webhook'

  routes:
    # Critical alerts re-notify every 5 minutes rather than hourly. A backup
    # failure that is announced once and then goes quiet for an hour is how the
    # 75-day gap stayed invisible.
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 5s
      repeat_interval: 5m

    - match:
        severity: warning
      receiver: 'default-webhook'
      repeat_interval: 30m

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://ivgs-fastapi:8001/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://ivgs-fastapi:8001/api/v1/alerts/webhook'
        send_resolved: true

inhibit_rules:
  # A critical alert suppresses a warning for the same alertname+node.
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'node']

  # BackupStale means no backup ran at all. BackupFailed means one ran and
  # failed. If both fire for the same backup_type, the staleness is the larger
  # fact and the failure is noise on top of it -- suppress the failure so the
  # operator gets one page, not two. Added 2026-08-14 with the BackupStale rule.
  - source_match:
      alertname: 'BackupStale'
    target_match:
      alertname: 'BackupFailed'
    equal: ['backup_type']
