# =============================================================================
# IVGS v5 — Nginx Reverse Proxy Configuration
# =============================================================================
# Spec reference: §2.3 Table 2-4 — Nginx on node-01 (443/80)
#                 §8.2 — WebSocket for live status updates
#                 §16.1 Table 16-1 — TLS recommended for LAN
#
# Routing:
#   /api/v1/*     → FastAPI backend (localhost:8001)
#   /ws/*         → FastAPI WebSocket (localhost:8001) with upgrade
#   /grafana/*    → Grafana (localhost:3000)
#   /*            → Next.js frontend (localhost:3001)
#   /health       → Direct 200 (load balancer probe)
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream fastapi {
        server fastapi-backend:8001;
        keepalive 32;
    }

    upstream nextjs {
        server nextjs-frontend:3001;
        keepalive 16;
    }

    upstream grafana {
        server grafana:3000;
        keepalive 8;
    }

    # ---------------------------------------------------------------------------
    # Rate limiting (§16.3)
    # Per-IP rate limits: 60 req/min content, 5 req/min auth
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL configuration (§16.1 — self-signed CA for LAN)
        ssl_certificate /etc/nginx/ssl/ivgs.crt;
        ssl_certificate_key /etc/nginx/ssl/ivgs.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Health check
        location = /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ----- API routes → FastAPI (§2.3 Table 2-4) -----
        location /api/v1/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Auth endpoints with stricter rate limiting (§16.3)
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- WebSocket for live status (§8.2) -----
        location /ws/ {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ----- Grafana (§13.2 — served under /grafana/) -----
        location /grafana/ {
            proxy_pass http://grafana;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana WebSocket (live dashboard updates)
        location /grafana/api/live/ {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ----- Static assets (Next.js) -----
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----- Default: Next.js frontend -----
        location / {
            proxy_pass http://nextjs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
