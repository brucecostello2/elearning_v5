# =============================================================================
# IVGS v5 — Nginx Reverse Proxy Configuration
# =============================================================================
# Spec reference: §2.3 Table 2-4 — Nginx on node-01 (443/80)
#                 §8.2 — WebSocket for live status updates
#                 §16.1 Table 16-1 — TLS recommended for LAN
#
# Routing:
#   /api/v1/*     → FastAPI backend (fastapi-backend:8001)
#   /ws/*         → FastAPI WebSocket (fastapi-backend:8001) with upgrade
#   /grafana/*    → Grafana (grafana:3000)
#   /*            → Next.js frontend (nextjs-frontend:3001)
#   /health       → Direct 200 (load balancer probe)
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss text/javascript image/svg+xml;

    # ---------------------------------------------------------------------------
    # Dynamic upstream resolution (P2.12 hardening)
    # ---------------------------------------------------------------------------
    # Re-query Docker's embedded DNS (127.0.0.11) every 10s so a recreated
    # fastapi-backend / nextjs-frontend / grafana container (new bridge IP) is
    # picked up WITHOUT restarting nginx. Static upstream{} blocks resolved only
    # once at startup and 502'd on container recreate (IVGS_Nginx_Hardening_Backlog).
    # proxy_pass targets are variables below to force per-request re-resolution.
    # NOTE: variable proxy_pass disables upstream keepalive pooling; the previous
    # keepalive directives were inert anyway (no proxy_http_version 1.1 +
    # Connection "" set in the proxied locations), so no working behaviour is lost.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Fail fast on a briefly-dead upstream IP (e.g. the <=10s re-resolution
    # window after a container recreate) instead of hanging on the 60s default.
    proxy_connect_timeout 2s;

    # ---------------------------------------------------------------------------
    # Rate limiting (§16.3)
    # Per-IP rate limits: 60 req/min content, 5 req/min auth
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health check endpoint (no redirect)
        # WP-IVGS-08 Task 3(b). RENAMED, not kept.
        #
        # This returned 200 unconditionally under the name `/health`, so a probe
        # against the ingress reported the SYSTEM healthy while asserting only
        # that nginx itself was running. Measured 2026-08-27 (WP-IVGS-03 S2.2):
        # `GET /health` answered 200 with the API stopped.
        #
        # An nginx-liveness probe is a legitimate thing to want; owning the name
        # `/health` is not. It is `/nginx-alive` now, and it says what it means.
        location = /nginx-alive {
            return 200 '{"status":"nginx-process-alive","asserts":"nothing about the API"}';
            add_header Content-Type application/json;
        }

        # The real health of the system is the API's, and it must be reachable
        # -- or fail -- through the ingress like any other route.
        location = /health {
            # `set` is per-location here (each API location declares its own),
            # so this block must declare it too -- inheriting it would be a
            # scope accident rather than a contract.
            set $fastapi_backend "http://fastapi-backend:8001";
            proxy_pass $fastapi_backend/api/v1/health;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL configuration (§16.1 — self-signed CA for LAN)
        ssl_certificate /etc/nginx/ssl/ivgs.crt;
        ssl_certificate_key /etc/nginx/ssl/ivgs.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security headers
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Health check
        # WP-IVGS-08 Task 3(b). THE CONTROL-PLANE FALSE GREEN.
        #
        # `return 200` here meant the ingress answered `/health` from nginx
        # itself and never reached the API. With the API stopped it still said
        # `{"status":"ok"}` -- a monitoring false-green on the control plane,
        # which is the one place a false green is least survivable.
        #
        # It now proxies to the API's own health route. If the API is down this
        # returns 502, which is the truth.
        location = /health {
            # `set` is per-location here (each API location declares its own),
            # so this block must declare it too -- inheriting it would be a
            # scope accident rather than a contract.
            set $fastapi_backend "http://fastapi-backend:8001";
            proxy_pass $fastapi_backend/api/v1/health;
        }

        # Kept under an honest name for probes that genuinely want to know
        # whether the ingress process is up (an LB target check).
        location = /nginx-alive {
            return 200 '{"status":"nginx-process-alive","asserts":"nothing about the API"}';
            add_header Content-Type application/json;
        }

        # ----- API routes → FastAPI (§2.3 Table 2-4) -----
        location /api/v1/ {
            limit_req zone=api_general burst=20 nodelay;
            set $fastapi_backend "http://fastapi-backend:8001";
            proxy_pass $fastapi_backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Auth endpoints with stricter rate limiting (§16.3)
        location /api/v1/auth/ {
            limit_req zone=api_auth burst=5 nodelay;
            set $fastapi_backend "http://fastapi-backend:8001";
            proxy_pass $fastapi_backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- WebSocket for live status (§8.2) -----
        location /ws/ {
            set $fastapi_backend "http://fastapi-backend:8001";
            proxy_pass $fastapi_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ----- Grafana (§13.2 — served under /grafana/) -----
        location /grafana/ {
            set $grafana_backend "http://grafana:3000";
            proxy_pass $grafana_backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana WebSocket (live dashboard updates)
        location /grafana/api/live/ {
            set $grafana_backend "http://grafana:3000";
            proxy_pass $grafana_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ----- Static assets (Next.js) -----
        location /_next/static/ {
            set $nextjs_frontend "http://nextjs-frontend:3001";
            proxy_pass $nextjs_frontend$request_uri;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----- Default: Next.js frontend -----
        location / {
            set $nextjs_frontend "http://nextjs-frontend:3001";
            proxy_pass $nextjs_frontend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
