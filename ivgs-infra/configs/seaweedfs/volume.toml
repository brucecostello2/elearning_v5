# =============================================================
# IVGS v5 — SeaweedFS Volume Server Configuration (node-01:8080)
# Hot tier (SSD) + Warm tier (HDD) per §10.1
# =============================================================

[volume]
  port = 8080
  ip = "0.0.0.0"
  publicUrl = "192.168.1.90:8080"   # node-01 LAN IP advertised to clients; environment-specific
  max = 0
  dataCenter = "dc1"
  rack = "rack1"
  compactionMBps = 50
  fileSizeLimitMB = 1024
  concurrentCompactLimit = 2
  concurrentUploadLimit = 64
  minFreeSpace = "5%"
  minFreeSpacePercent = 5

# Hot tier — SSD
[[volume.disk]]
  dir = "/data/seaweedfs/hot"
  maxVolumes = 200
  diskType = "ssd"

# Warm tier — HDD
[[volume.disk]]
  dir = "/data/seaweedfs/warm"
  maxVolumes = 500
  diskType = "hdd"
