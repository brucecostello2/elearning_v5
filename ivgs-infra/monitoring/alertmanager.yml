# IVGS v5 — Alertmanager Configuration
# Routes alerts from Prometheus to notification channels

global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@ivgs.local'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 5s
      repeat_interval: 5m

    - match:
        severity: warning
      receiver: 'default-webhook'
      repeat_interval: 30m

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://ivgs-api:8001/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://ivgs-api:8001/api/v1/alerts/webhook'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'node']
