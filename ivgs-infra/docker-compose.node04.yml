# =============================================================================
# IVGS v5 — Docker Compose: node-04 (Image, TTS, Talking Head)
# =============================================================================
# Spec reference: §2.4 Docker Compose Stacks — node-04
#
# Node-04 role (Table 2-2):
#   NVIDIA RTX 5000 Pro Blackwell — 48 GB VRAM
#   ComfyUI (FLUX.1 Dev, AnimateDiff), Coqui XTTS v2, Kokoro TTS,
#   WhisperX alignment, LatentSync, SadTalker, vLLM mid-size (Mistral 24B)
#
# Services (10 per §2.4):
#   1.  vllm             — Mid-size LLM (:8000)
#   2.  comfyui          — Image generation (:8188)
#   3.  coqui-tts        — Primary TTS (:5002)
#   4.  kokoro-tts       — English-only TTS fallback (:5003)
#   5.  whisperx         — Speech alignment (:9000)
#   6.  latentsync       — Primary lip-sync (:7860)
#   7.  sadtalker        — Fallback lip-sync (:7861)
#   8.  celery-worker    — Image/TTS/talking-head queues
#   9.  node-exporter    — System metrics (:9100)
#  10.  nvidia-gpu-exporter — GPU metrics (:9400)
# =============================================================================

version: "3.8"

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 120s

x-common-logging: &common-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-common-restart: &common-restart
  restart: unless-stopped

x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

networks:
  ivgs-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # Service 1: vLLM Mid-Size (Mistral 24B — Table B-1: 48 GB)
  # Used for prompt refinement and storyboard when 70B models are busy
  # GPU scheduler ensures non-concurrent load with FLUX.1
  # ---------------------------------------------------------------------------
  vllm:
    image: vllm/vllm-openai:v0.6.4
    container_name: ivgs-vllm-midsize
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      VLLM_HOST: "0.0.0.0"
      VLLM_PORT: "8000"
      HF_HOME: /data/models
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    command: >
      --model ${VLLM_MODEL_NAME:-mistralai/Mistral-Small-24B-Instruct-2501}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization 0.85
      --dtype bfloat16
      --trust-remote-code
      --api-key ${VLLM_API_KEY:-ivgs-internal}
      --served-model-name ${VLLM_SERVED_NAME:-mistral-24b}
      --disable-log-requests
    shm_size: "8g"

  # ---------------------------------------------------------------------------
  # Service 2: ComfyUI (FLUX.1 Dev, AnimateDiff)
  # Primary image generation — Table B-1: FLUX.1 Dev 24 GB
  # GPU scheduler prevents concurrent load with vLLM mid-size
  # ---------------------------------------------------------------------------
  comfyui:
    image: ghcr.io/brucecostello2/ivgs-workers:comfyui-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-comfyui-primary
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      COMFYUI_PORT: "8188"
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models
      - /data/comfyui-output:/output
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:8188:8188"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8188/system_stats || exit 1"]
    shm_size: "8g"

  # ---------------------------------------------------------------------------
  # Service 3: Coqui XTTS v2 (Primary TTS — Table B-1: 16 GB)
  # Multilingual TTS per §17.1: 8 languages
  # Typically kept resident on node-04
  # ---------------------------------------------------------------------------
  coqui-tts:
    image: ghcr.io/brucecostello2/ivgs-workers:coqui-tts-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-coqui-tts
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      TTS_PORT: "5002"
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:5002:5002"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/health || exit 1"]
    shm_size: "4g"

  # ---------------------------------------------------------------------------
  # Service 4: Kokoro TTS (English-only fallback — Table B-1: 4 GB)
  # ---------------------------------------------------------------------------
  kokoro-tts:
    image: ghcr.io/brucecostello2/ivgs-workers:kokoro-tts-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-kokoro-tts
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      KOKORO_PORT: "5003"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
    ports:
      - "0.0.0.0:5003:5003"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:5003/health || exit 1"]

  # ---------------------------------------------------------------------------
  # Service 5: WhisperX (Speech alignment — Table B-1: 8 GB)
  # Word-level timestamp alignment for caption generation per §17.3
  # ---------------------------------------------------------------------------
  whisperx:
    image: ghcr.io/brucecostello2/ivgs-workers:whisperx-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-whisperx
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      WHISPERX_PORT: "9000"
      CUDA_VISIBLE_DEVICES: "0"
      WHISPERX_MODEL: "large-v3"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:9000:9000"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]

  # ---------------------------------------------------------------------------
  # Service 6: LatentSync (Primary lip-sync — Table B-1: 12 GB)
  # Talking head generation per §7.1
  # ---------------------------------------------------------------------------
  latentsync:
    image: ghcr.io/brucecostello2/ivgs-workers:latentsync-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-latentsync
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      LATENTSYNC_PORT: "7860"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:7860:7860"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health || exit 1"]

  # ---------------------------------------------------------------------------
  # Service 7: SadTalker (Fallback lip-sync — Table B-1: 8 GB)
  # ---------------------------------------------------------------------------
  sadtalker:
    image: ghcr.io/brucecostello2/ivgs-workers:sadtalker-${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-sadtalker
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      SADTALKER_PORT: "7861"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:7861:7861"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:7861/health || exit 1"]

  # ---------------------------------------------------------------------------
  # Service 8: Celery Worker (image/TTS/talking-head queues)
  # ---------------------------------------------------------------------------
  celery-worker:
    image: ghcr.io/brucecostello2/ivgs-api:${IVGS_API_TAG:?IVGS_API_TAG required}
    container_name: ivgs-celery-node04
    <<: [*common-restart, *common-logging]
    env_file:
      - .env.node04
    environment:
      REDIS_URL: redis://${NODE_01_IP}:6379/0
      DATABASE_URL: postgresql+psycopg://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs
      IVGS_GPU_SCHEDULER_URL: http://${NODE_01_IP}:8002
      SEAWEEDFS_FILER_URL: http://${NODE_01_IP}:8888
      COMFYUI_PRIMARY_URL: http://comfyui:8188
      COQUI_TTS_URL: http://coqui-tts:5002
      KOKORO_TTS_URL: http://kokoro-tts:5003
      WHISPERX_URL: http://whisperx:9000
      LATENTSYNC_URL: http://latentsync:7860
      SADTALKER_URL: http://sadtalker:7861
      VLLM_MIDSIZE_URL: http://vllm:8000/v1
      NODE_HOSTNAME: node-04
      C_FORCE_ROOT: "1"
    volumes:
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    networks:
      - ivgs-net
    command: >
      celery -A celery_app worker
        --loglevel=info
        --queues=image_generation,tts_synthesis,talking_head,caption_generation,quality_scoring
        --concurrency=2
        --max-tasks-per-child=20
        -n celery-worker@node04

  # ---------------------------------------------------------------------------
  # Service 9: Node Exporter
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ivgs-node-exporter
    <<: [*common-restart, *common-logging]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "0.0.0.0:9100:9100"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  # ---------------------------------------------------------------------------
  # Service 10: NVIDIA GPU Exporter
  # ---------------------------------------------------------------------------
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.2.1
    container_name: ivgs-nvidia-gpu-exporter
    <<: [*common-restart, *common-logging, *gpu-resources]
    ports:
      - "0.0.0.0:9400:9400"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9400/metrics || exit 1"]
