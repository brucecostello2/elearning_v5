# =============================================================================
# IVGS v5 — Docker Compose: node-04 (Image / TTS / Talking-Head media tier)
# =============================================================================
# Spec reference: §2.4 Docker Compose Stacks — node-04 (Table 2-2)
#   NVIDIA RTX 5000 Pro Blackwell — 48 GB VRAM
#   ComfyUI (FLUX.1), Coqui XTTS v2, Kokoro TTS, WhisperX, LatentSync,
#   SadTalker, vLLM mid-size (Mistral 24B)
#
# RECONCILED 2026-06-02:
#   ACTIVE (default `up`):  comfyui + celery-worker(gpu_image) + node-exporter
#   PENDING (profiles: pending — start once built/staged/proven via its client):
#       vllm, coqui-tts, kokoro-tts, whisperx, latentsync, sadtalker
#   nvidia-gpu-exporter REMOVED (utkuozdemir 1.2.1 invalid-metric-name crashloop
#       on Blackwell; replacement tracked under monitoring-hygiene).
#
# Run the active services:
#   docker compose --env-file .env.node04 -f docker-compose.node04.yml up -d comfyui celery-worker node-exporter
# Activate a pending service later (after build/stage/prove):
#   docker compose --env-file .env.node04 -f docker-compose.node04.yml --profile pending up -d <service>
# =============================================================================

x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 120s

x-common-logging: &common-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-common-restart: &common-restart
  restart: unless-stopped

x-gpu-resources: &gpu-resources
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

networks:
  ivgs-net:
    driver: bridge

services:
  # ---------------------------------------------------------------------------
  # ACTIVE — ComfyUI / FLUX.1 image server (proven via flux_client.generate_image).
  # GPU + weights live here; the FLUX checkpoint is mounted read-only at the path
  # CheckpointLoaderSimple reads from. Healthcheck = the image's built-in (proven
  # healthy in the manual run). pull_policy: never — image is local-only, recovered
  # from the docker-save artifact, never pulled from GHCR.
  # ---------------------------------------------------------------------------
  comfyui:
    image: ghcr.io/brucecostello2/ivgs-workers:comfyui-${IVGS_COMFYUI_TAG:-v5.2.7-h0}
    container_name: ivgs-comfyui-primary
    command: ["sh", "-c", "python /app/ComfyUI/main.py --listen 0.0.0.0 --port 8188 --disable-dynamic-vram"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    environment:
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models/comfyui/checkpoints:/app/ComfyUI/models/checkpoints:ro
    ports:
      - "0.0.0.0:8188:8188"
    networks:
      - ivgs-net
    shm_size: "8g"

  # ---------------------------------------------------------------------------
  # ACTIVE — Celery worker for the image queue. Only comfyui is up, so it
  # consumes gpu_image only; add gpu_tts / gpu_talking_head (or dedicated workers
  # per node-03's pattern) as those servers come online.
  # ---------------------------------------------------------------------------
  celery-worker:
    image: ghcr.io/brucecostello2/ivgs-workers:${IVGS_WORKERS_TAG:?IVGS_WORKERS_TAG required}
    container_name: ivgs-celery-node04
    depends_on: [comfyui]
    <<: [*common-restart, *common-logging]
    env_file:
      - .env.node04
    environment:
      REDIS_URL: redis://${NODE_01_IP}:6379/0
      DATABASE_URL: postgresql+psycopg://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs
      IVGS_CELERY_BROKER_URL: "redis://${NODE_01_IP}:6379/0"
      IVGS_CELERY_RESULT_BACKEND: "db+postgresql+psycopg2://ivgs:${POSTGRES_PASSWORD}@${NODE_01_IP}:5432/ivgs"
      API_BASE_URL: "http://${NODE_01_IP}:8001"
      IVGS_GPU_SCHEDULER_URL: "http://${NODE_01_IP}:8002"
      SEAWEEDFS_FILER_URL: "http://${NODE_01_IP}:8888"
      COMFYUI_PRIMARY_URL: "http://comfyui:8188"
      IVGS_COMFYUI_URL: "http://comfyui:8188"
      # Image stage = mid-size vLLM (Mistral-24B) writes the FLUX-compatible prompt,
      # then ComfyUI/FLUX renders it (Table 6-1). VLLM_MIDSIZE_URL is node-04's own
      # vllm service (resolves once the pending vllm is activated); until then a
      # gpu_image task completes only the render half. Primary/secondary are the
      # 70B LLM tiers on node-02/03 (not called by this image worker).
      VLLM_PRIMARY_URL: "http://${NODE_02_IP}:8000"
      VLLM_SECONDARY_URL: "http://${NODE_03_IP}:8000"
      VLLM_MIDSIZE_URL: "http://vllm:8000"
      IVGS_VLLM_MIDSIZE_MODEL: "mistral-24b"
      IVGS_VLLM_API_KEY: "${VLLM_API_KEY:-ivgs-internal}"
      NODE_HOSTNAME: node-04
      C_FORCE_ROOT: "1"
    volumes:
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    networks:
      - ivgs-net
    command: >
      celery -A celery_app worker
        --loglevel=info
        --queues=gpu_image,gpu_tts
        --concurrency=1
        --max-tasks-per-child=20
        -n image-worker@node04

  # ---------------------------------------------------------------------------
  # ACTIVE — Node Exporter (§13.1, port 9100)
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ivgs-node-exporter
    <<: [*common-restart, *common-logging]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "0.0.0.0:9100:9100"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

  # ===========================================================================
  # PENDING (profiles: pending) — excluded from a default `up`. Activate a
  # service only after its image is built, weights staged, and it is proven via
  # its real *_client. pull_policy: never (local-only images). Ports/mounts/
  # healthchecks below are the spec defaults and will be confirmed per service
  # when each is actually built.
  # ===========================================================================

  # vLLM mid-size (Mistral 24B). Blackwell nightly image. Cannot co-reside with
  # FLUX on a 48 GB card — the GPU scheduler must gate dispatch; kept pending
  # until that contention is wired and Mistral-24B weights are staged.
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-cu130-nightly}
    container_name: ivgs-vllm-midsize
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      VLLM_HOST: "0.0.0.0"
      VLLM_PORT: "8000"
      HF_HOME: /data/models
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
    command: >
      --model ${VLLM_MODEL_NAME:-mistralai/Mistral-Small-24B-Instruct-2501}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization 0.85
      --dtype bfloat16
      --trust-remote-code
      --api-key ${VLLM_API_KEY:-ivgs-internal}
      --served-model-name ${VLLM_SERVED_NAME:-mistral-24b}
      --disable-log-requests
    shm_size: "8g"

  # Coqui XTTS v2 — primary multilingual TTS (Table B-1: 16 GB; §17.1: 8 langs)
  coqui-tts:
    image: ghcr.io/brucecostello2/ivgs-workers:coqui-${IVGS_COQUI_TAG:-v5.2.7-h0}
    container_name: ivgs-coqui
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      TTS_PORT: "5002"
      CUDA_VISIBLE_DEVICES: "0"
      HF_HOME: /data/models
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:5002:5002"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/health || exit 1"]
    shm_size: "4g"

  # Kokoro TTS — English-only fallback (Table B-1: 4 GB)
  kokoro-tts:
    image: ghcr.io/brucecostello2/ivgs-workers:kokoro-${IVGS_KOKORO_TAG:-v5.2.7-h0}
    container_name: ivgs-kokoro
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      KOKORO_PORT: "5003"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
    ports:
      - "0.0.0.0:5003:5003"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:5003/health || exit 1"]

  # WhisperX — speech alignment for captions (Table B-1: 8 GB; large-v3)
  whisperx:
    image: ghcr.io/brucecostello2/ivgs-workers:whisperx-${IVGS_WHISPERX_TAG:-v5.2.7-h0}
    container_name: ivgs-whisperx
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      WHISPERX_PORT: "9000"
      CUDA_VISIBLE_DEVICES: "0"
      WHISPERX_MODEL: "large-v3"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:9000:9000"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]

  # LatentSync — primary lip-sync / talking head (Table B-1: 12 GB)
  latentsync:
    image: ghcr.io/brucecostello2/ivgs-workers:latentsync-${IVGS_LATENTSYNC_TAG:-v5.2.7-h0}
    container_name: ivgs-latentsync
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      LATENTSYNC_PORT: "7860"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:7860:7860"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/health || exit 1"]

  # SadTalker — fallback lip-sync (Table B-1: 8 GB)
  sadtalker:
    image: ghcr.io/brucecostello2/ivgs-workers:sadtalker-${IVGS_SADTALKER_TAG:-v5.2.7-h0}
    container_name: ivgs-sadtalker
    profiles: ["pending"]
    pull_policy: never
    <<: [*common-restart, *common-logging, *gpu-resources]
    env_file:
      - .env.node04
    environment:
      SADTALKER_PORT: "7861"
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - /data/models:/data/models
      - /mnt/ivgs-shared:/mnt/ivgs-shared
    ports:
      - "0.0.0.0:7861:7861"
    networks:
      - ivgs-net
    healthcheck:
      <<: *common-healthcheck
      test: ["CMD-SHELL", "curl -sf http://localhost:7861/health || exit 1"]
