# Phase 1 Nginx overlay — add GPU Scheduler upstream and routes
# Include in nginx.conf: include /etc/nginx/conf.d/phase1.conf;

upstream gpu_scheduler {
    server ivgs-scheduler:8001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zone for GPU scheduler endpoints
limit_req_zone $binary_remote_addr zone=gpu_api:10m rate=30r/s;

server {
    listen 443 ssl http2;
    server_name api.ivgs.internal;

    # Existing SSL config inherits from base nginx.conf
    include /etc/nginx/ssl_params.conf;

    # ── GPU Scheduler proxy ──────────────────────────────────────
    location /api/v4/gpu/ {
        limit_req zone=gpu_api burst=50 nodelay;

        proxy_pass         http://gpu_scheduler/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout  5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # ── Internal health endpoint (no auth) ──────────────────────
    location /internal/scheduler/health {
        allow 10.10.0.0/24;
        deny  all;
        proxy_pass http://gpu_scheduler/health;
    }

    # ── Checkpoint streaming (SSE) ───────────────────────────────
    location /api/v4/jobs/ {
        proxy_pass         http://ivgs_api/api/v4/jobs/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }
}
