version: "3.9"

# Phase 4 overlay — SeaweedFS cluster + NAS mount + Phase 4 services
# Usage: docker compose -f docker-compose.base.yml -f docker-compose.phase4.yml up

services:

  # ----------------------------------------------------------------
  # SeaweedFS Master (metadata coordination) — node-01
  # ----------------------------------------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    command: >
      master
        -ip=node-01
        -port=9333
        -mdir=/data/master
        -defaultReplication=001
        -volumeSizeLimitMB=30000
    volumes:
      - /mnt/nvme/seaweedfs/master:/data/master
    ports:
      - "9333:9333"
    networks:
      - ivgs-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------
  # SeaweedFS Filer (POSIX filesystem interface) — node-01
  # ----------------------------------------------------------------
  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    command: >
      filer
        -master=node-01:9333
        -port=8888
        -ip=node-01
        -defaultReplicaPlacement=001
    depends_on:
      - seaweedfs-master
    volumes:
      - /mnt/nvme/seaweedfs/filer:/data/filer
    ports:
      - "8888:8888"
    networks:
      - ivgs-net
    restart: unless-stopped

  # ----------------------------------------------------------------
  # SeaweedFS Volume Servers — one per node per tier
  # HOT  : node-02 /mnt/nvme   (NVMe — fast, small)
  # WARM : node-03 /mnt/ssd    (SSD — medium speed)
  # COLD : node-04 /mnt/hdd    (HDD — bulk storage)
  # ARCHIVE: node-05 /mnt/archive  (slow HDD / tape)
  # ----------------------------------------------------------------
  seaweedfs-volume-hot:
    image: chrislusf/seaweedfs:latest
    command: >
      volume
        -mserver=node-01:9333
        -dir=/data/hot
        -port=8080
        -ip=node-02
        -dataCenter=dc1
        -rack=nvme-rack
        -collection=hot
    deploy:
      placement:
        constraints: [node.hostname == node-02]
    volumes:
      - /mnt/nvme/seaweedfs/volumes:/data/hot
    ports:
      - "8080:8080"
    networks:
      - ivgs-net
    restart: unless-stopped

  seaweedfs-volume-warm:
    image: chrislusf/seaweedfs:latest
    command: >
      volume
        -mserver=node-01:9333
        -dir=/data/warm
        -port=8081
        -ip=node-03
        -dataCenter=dc1
        -rack=ssd-rack
        -collection=warm
    deploy:
      placement:
        constraints: [node.hostname == node-03]
    volumes:
      - /mnt/ssd/seaweedfs/volumes:/data/warm
    ports:
      - "8081:8081"
    networks:
      - ivgs-net
    restart: unless-stopped

  seaweedfs-volume-cold:
    image: chrislusf/seaweedfs:latest
    command: >
      volume
        -mserver=node-01:9333
        -dir=/data/cold
        -port=8082
        -ip=node-04
        -dataCenter=dc1
        -rack=hdd-rack
        -collection=cold
    deploy:
      placement:
        constraints: [node.hostname == node-04]
    volumes:
      - /mnt/hdd/seaweedfs/volumes:/data/cold
    ports:
      - "8082:8082"
    networks:
      - ivgs-net
    restart: unless-stopped

  seaweedfs-volume-archive:
    image: chrislusf/seaweedfs:latest
    command: >
      volume
        -mserver=node-01:9333
        -dir=/data/archive
        -port=8083
        -ip=node-05
        -dataCenter=dc1
        -rack=archive-rack
        -collection=archive
    deploy:
      placement:
        constraints: [node.hostname == node-05]
    volumes:
      - /mnt/archive/seaweedfs/volumes:/data/archive
    ports:
      - "8083:8083"
    networks:
      - ivgs-net
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Celery Beat (Phase 4 scheduled tasks)
  # ----------------------------------------------------------------
  celery-beat:
    image: ivgs-worker:latest
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler=redbeat.RedBeatScheduler
    environment:
      - DATABASE_URL=postgresql://ivgs:${POSTGRES_PASSWORD}@node-01:5432/ivgs
      - REDIS_URL=redis://node-01:6379/1
      - SEAWEEDFS_MASTER_URL=http://node-01:9333
      - SEAWEEDFS_FILER_URL=http://node-01:8888
      - NAS_BACKUP_PATH=/mnt/backup
      - BACKUP_RETENTION_DAYS=30
      # No AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY — not needed
    volumes:
      - /mnt/workdir:/mnt/workdir
      - /mnt/backup:/mnt/backup
    networks:
      - ivgs-net
    restart: unless-stopped
    depends_on:
      - seaweedfs-filer

  # Phase 4 worker (I/O bound — separate from GPU workers)
  celery-worker-ops:
    image: ivgs-worker:latest
    command: celery -A app.core.celery_app worker -Q default --concurrency=4 --loglevel=info
    environment:
      - DATABASE_URL=postgresql://ivgs:${POSTGRES_PASSWORD}@node-01:5432/ivgs
      - REDIS_URL=redis://node-01:6379/0
      - SEAWEEDFS_MASTER_URL=http://node-01:9333
      - SEAWEEDFS_FILER_URL=http://node-01:8888
      - NAS_BACKUP_PATH=/mnt/backup
    volumes:
      - /mnt/workdir:/mnt/workdir
      - /mnt/backup:/mnt/backup
    networks:
      - ivgs-net
    restart: unless-stopped

networks:
  ivgs-net:
    external: true
